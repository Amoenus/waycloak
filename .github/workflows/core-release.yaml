name: Core release

on:
  push:
    tags:
      - "v*-core.*"

permissions: {}

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Amoenus/waycloak'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    outputs:
      chart_digest: ${{ steps.publish-chart.outputs.digest }}
      chart_repository: ${{ steps.publish-chart.outputs.repository }}
      gateway_agent_digest: ${{ steps.publish-images.outputs.gateway_agent_digest }}
      gateway_agent_repository: ${{ steps.publish-images.outputs.gateway_agent_repository }}
      gluetun_digest: ${{ steps.publish-gluetun.outputs.digest }}
      gluetun_repository: ${{ steps.publish-gluetun.outputs.repository }}
      node_agent_digest: ${{ steps.publish-images.outputs.node_agent_digest }}
      node_agent_repository: ${{ steps.publish-images.outputs.node_agent_repository }}
      replacement_controller_digest: ${{ steps.publish-images.outputs.replacement_controller_digest }}
      replacement_controller_repository: ${{ steps.publish-images.outputs.replacement_controller_repository }}
      waycloak_cni_digest: ${{ steps.publish-images.outputs.waycloak_cni_digest }}
      waycloak_cni_repository: ${{ steps.publish-images.outputs.waycloak_cni_repository }}
    steps:
      - name: Check out exact Core candidate tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the immutable Core candidate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-core\.[0-9]+$ ]]; then
            echo "Core publication requires vMAJOR.MINOR.PATCH-core.NUMBER" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.1
      - name: Install checksummed security tools
        run: bash hack/install-security-tools.sh
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Reproduce the multi-platform Core images before publication
        run: |
          for build in first second; do
            make core-runtime-images-oci \
              REPLACEMENT_CONTROLLER_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/controller" \
              WAYCLOAK_CNI_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/cni" \
              NODE_AGENT_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/node-agent" \
              GATEWAY_AGENT_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/gateway-agent" \
              REPLACEMENT_CONTROLLER_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-replacement-controller \
              WAYCLOAK_CNI_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-cni \
              NODE_AGENT_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-node-agent \
              GATEWAY_AGENT_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-gateway-agent
          done
          diff --recursive --no-dereference "$RUNNER_TEMP/repro-first" "$RUNNER_TEMP/repro-second"
      - name: Publish first-party images and capture only exact digests
        id: publish-images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/core
          release_version="${RELEASE_TAG#v}"

          publish_image() {
            local key="$1" name="$2" repository="$3" import_path="$4"
            local refs_file="$RUNNER_TEMP/${name}.refs"
            KO_DOCKER_REPO="$repository" go run github.com/google/ko@v0.19.1 build \
              --bare \
              --tags "$release_version" \
              --platform=linux/amd64,linux/arm64 \
              --sbom=spdx \
              --image-refs "$refs_file" \
              "$import_path"
            local reference tag_digest
            local -a references
            mapfile -t references <"$refs_file"
            if [[ "${#references[@]}" -ne 3 ]]; then
              echo "publisher did not return one index and two platform references for ${name}" >&2
              exit 1
            fi
            reference="${references[0]}"
            if [[ ! "$reference" =~ ^${repository}@sha256:[a-f0-9]{64}$ ]]; then
              echo "publisher did not return one exact ${name} digest" >&2
              exit 1
            fi
            for child_reference in "${references[@]:1}"; do
              [[ "$child_reference" =~ ^${repository}@sha256:[a-f0-9]{64}$ ]]
            done
            tag_digest="$(docker buildx imagetools inspect "$repository:$release_version" | awk '$1 == "Digest:" {print $2; exit}')"
            test "$tag_digest" = "${reference#*@}"
            printf '%s\n' "$reference" >"dist/core/${name}.ref"
            {
              printf '%s_repository=%s\n' "$key" "$repository"
              printf '%s_digest=%s\n' "$key" "${reference#*@}"
            } >>"$GITHUB_OUTPUT"
          }

          publish_image replacement_controller replacement-controller ghcr.io/amoenus/waycloak-replacement-controller ./cmd/replacement-controller
          publish_image waycloak_cni waycloak-cni ghcr.io/amoenus/waycloak-cni ./cmd/waycloak-cni
          publish_image node_agent waycloak-node-agent ghcr.io/amoenus/waycloak-node-agent ./cmd/waycloak-node-agent
          publish_image gateway_agent waycloak-gateway-agent ghcr.io/amoenus/waycloak-gateway-agent ./cmd/waycloak-gateway-agent
      - name: Build, test, and publish the vulnerability-gated Gluetun derivative
        id: publish-gluetun
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          upstream_commit=7eed6eaf160440724a93ca66f66055068cebe4ac
          upstream_image=docker.io/qmcgaw/gluetun@sha256:e3272b29a4bc177b389fbdcb54cf9716ccbfc30f04d8b7a35b0a5be9cdb58461
          repository=ghcr.io/amoenus/waycloak-gluetun
          release_version="${RELEASE_TAG#v}"

          checkout_upstream() {
            local destination="$1"
            git init "$destination"
            git -C "$destination" remote add origin https://github.com/passteque/gluetun.git
            git -C "$destination" fetch --depth=1 origin "$upstream_commit"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$upstream_commit"
          }

          checkout_upstream "$RUNNER_TEMP/gluetun-source-first"
          checkout_upstream "$RUNNER_TEMP/gluetun-source-second"
          GO=go bash hack/build-gluetun-candidate.sh \
            "$RUNNER_TEMP/gluetun-source-first" "$RUNNER_TEMP/gluetun-first" \
            "$upstream_commit" "$RELEASE_TAG"
          GO=go bash hack/build-gluetun-candidate.sh \
            "$RUNNER_TEMP/gluetun-source-second" "$RUNNER_TEMP/gluetun-second" \
            "$upstream_commit" "$RELEASE_TAG"
          diff --recursive --no-dereference "$RUNNER_TEMP/gluetun-first" "$RUNNER_TEMP/gluetun-second"
          (cd "$RUNNER_TEMP/gluetun-source-first" && sudo env "PATH=$PATH" GOWORK=off go test ./...)

          docker buildx build \
            --file build/gluetun-candidate/Dockerfile \
            --platform=linux/amd64,linux/arm64 \
            --build-arg "UPSTREAM_IMAGE=$upstream_image" \
            --build-arg "GLUETUN_UPSTREAM_COMMIT=$upstream_commit" \
            --build-arg "WAYCLOAK_RELEASE=$RELEASE_TAG" \
            --build-arg "WAYCLOAK_SOURCE_COMMIT=$GITHUB_SHA" \
            --provenance=false \
            --sbom=false \
            --tag "$repository:$release_version" \
            --push \
            "$RUNNER_TEMP/gluetun-first"
          digest="$(docker buildx imagetools inspect "$repository:$release_version" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "derived Gluetun publisher did not return one exact index digest" >&2
            exit 1
          fi
          printf '%s@%s\n' "$repository" "$digest" >dist/core/gluetun.ref
          cp "$RUNNER_TEMP/gluetun-first/gluetun-dependency.patch" dist/core/
          cp "$RUNNER_TEMP/gluetun-first/LICENSE" dist/core/gluetun.LICENSE
          cp "$RUNNER_TEMP/gluetun-first/gluetun-binaries.SHA256SUMS" dist/core/
          {
            printf 'repository=%s\n' "$repository"
            printf 'digest=%s\n' "$digest"
          } >>"$GITHUB_OUTPUT"
      - name: Reproducibly package and publish the Helm chart
        id: publish-chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          repository="ghcr.io/amoenus/charts/waycloak"
          for build in first second; do
            mkdir -p "$RUNNER_TEMP/chart-$build"
            helm package charts/waycloak \
              --version "$release_version" \
              --app-version "$RELEASE_TAG" \
              --destination "$RUNNER_TEMP/chart-$build" >/dev/null
          done
          cmp "$RUNNER_TEMP/chart-first/waycloak-$release_version.tgz" "$RUNNER_TEMP/chart-second/waycloak-$release_version.tgz"
          cp "$RUNNER_TEMP/chart-first/waycloak-$release_version.tgz" dist/core/
          helm push "dist/core/waycloak-$release_version.tgz" oci://ghcr.io/amoenus/charts >"$RUNNER_TEMP/chart-push.txt"
          digest="$(awk '$1 == "Digest:" {print $2}' "$RUNNER_TEMP/chart-push.txt")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Helm did not return an exact chart digest" >&2
            exit 1
          fi
          printf 'oci://%s@%s\n' "$repository" "$digest" >dist/core/waycloak-chart.ref
          {
            printf 'repository=%s\n' "$repository"
            printf 'digest=%s\n' "$digest"
            printf 'package=%s\n' "dist/core/waycloak-$release_version.tgz"
          } >>"$GITHUB_OUTPUT"
      - name: Generate replacement-controller SPDX SBOM
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          image: ${{ steps.publish-images.outputs.replacement_controller_repository }}@${{ steps.publish-images.outputs.replacement_controller_digest }}
          format: spdx-json
          output-file: dist/core/replacement-controller.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CNI SPDX SBOM
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          image: ${{ steps.publish-images.outputs.waycloak_cni_repository }}@${{ steps.publish-images.outputs.waycloak_cni_digest }}
          format: spdx-json
          output-file: dist/core/waycloak-cni.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate node-agent SPDX SBOM
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          image: ${{ steps.publish-images.outputs.node_agent_repository }}@${{ steps.publish-images.outputs.node_agent_digest }}
          format: spdx-json
          output-file: dist/core/waycloak-node-agent.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate gateway-agent SPDX SBOM
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          image: ${{ steps.publish-images.outputs.gateway_agent_repository }}@${{ steps.publish-images.outputs.gateway_agent_digest }}
          format: spdx-json
          output-file: dist/core/waycloak-gateway-agent.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate Gluetun derivative SPDX SBOM
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          image: ${{ steps.publish-gluetun.outputs.repository }}@${{ steps.publish-gluetun.outputs.digest }}
          format: spdx-json
          output-file: dist/core/gluetun.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate chart SPDX SBOM
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          file: ${{ steps.publish-chart.outputs.package }}
          format: spdx-json
          output-file: dist/core/waycloak-chart.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Enforce the release vulnerability policy
        run: |
          while read -r reference; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$reference"
          done < <(cat dist/core/*.ref | grep -v '^oci://')
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            registry.k8s.io/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Assemble the canonical exact Core release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          go run ./hack/corerelease \
            --version "$RELEASE_TAG" \
            --chart "$(cat dist/core/waycloak-chart.ref)" \
            --image "replacement-controller=$(cat dist/core/replacement-controller.ref)" \
            --image "waycloak-cni=$(cat dist/core/waycloak-cni.ref)" \
            --image "waycloak-node-agent=$(cat dist/core/waycloak-node-agent.ref)" \
            --image "waycloak-gateway-agent=$(cat dist/core/waycloak-gateway-agent.ref)" \
            --image "gluetun=$(cat dist/core/gluetun.ref)" \
            --image pause=registry.k8s.io/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c \
            >dist/core/core-release-manifest.json
      - name: Sign exact OCI identities, SBOM attestations, and release inventory
        run: |
          sign_image() {
            local reference="$1" predicate="$2"
            bash hack/cosign-retry.sh sign --yes "$reference"
            bash hack/cosign-retry.sh attest --yes --type spdxjson --predicate "$predicate" "$reference"
          }
          sign_image "$(cat dist/core/replacement-controller.ref)" dist/core/replacement-controller.spdx.json
          sign_image "$(cat dist/core/waycloak-cni.ref)" dist/core/waycloak-cni.spdx.json
          sign_image "$(cat dist/core/waycloak-node-agent.ref)" dist/core/waycloak-node-agent.spdx.json
          sign_image "$(cat dist/core/waycloak-gateway-agent.ref)" dist/core/waycloak-gateway-agent.spdx.json
          sign_image "$(cat dist/core/gluetun.ref)" dist/core/gluetun.spdx.json

          chart_reference="$(sed 's|^oci://||' dist/core/waycloak-chart.ref)"
          sign_image "$chart_reference" dist/core/waycloak-chart.spdx.json
          bash hack/cosign-retry.sh sign-blob --yes \
            --bundle dist/core/core-release-manifest.sigstore.json \
            dist/core/core-release-manifest.json

          (cd dist/core && find . -maxdepth 1 -type f \
            ! -name 'core-SHA256SUMS*' -printf '%f\n' | sort | xargs sha256sum >core-SHA256SUMS)
          bash hack/cosign-retry.sh sign-blob --yes \
            --bundle dist/core/core-SHA256SUMS.sigstore.json \
            dist/core/core-SHA256SUMS
      - name: Attest replacement-controller provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.publish-images.outputs.replacement_controller_repository }}
          subject-digest: ${{ steps.publish-images.outputs.replacement_controller_digest }}
          push-to-registry: true
      - name: Attest CNI provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.publish-images.outputs.waycloak_cni_repository }}
          subject-digest: ${{ steps.publish-images.outputs.waycloak_cni_digest }}
          push-to-registry: true
      - name: Attest node-agent provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.publish-images.outputs.node_agent_repository }}
          subject-digest: ${{ steps.publish-images.outputs.node_agent_digest }}
          push-to-registry: true
      - name: Attest gateway-agent provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.publish-images.outputs.gateway_agent_repository }}
          subject-digest: ${{ steps.publish-images.outputs.gateway_agent_digest }}
          push-to-registry: true
      - name: Attest Gluetun derivative provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.publish-gluetun.outputs.repository }}
          subject-digest: ${{ steps.publish-gluetun.outputs.digest }}
          push-to-registry: true
      - name: Attest chart provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.publish-chart.outputs.repository }}
          subject-digest: ${{ steps.publish-chart.outputs.digest }}
          push-to-registry: true
      - name: Attest downloadable Core artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/core/*
      - name: Publish immutable Core candidate assets
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
          files: dist/core/*

  verify-published-core:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Check out exact Core candidate tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.1
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Download the published candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/published"
      - name: Verify checksums, canonical inventory, and blob signatures
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: ${{ runner.temp }}/published
        run: |
          expected=(
            core-SHA256SUMS
            core-SHA256SUMS.sigstore.json
            core-release-manifest.json
            core-release-manifest.sigstore.json
            gluetun-binaries.SHA256SUMS
            gluetun-dependency.patch
            gluetun.LICENSE
            gluetun.ref
            gluetun.spdx.json
            replacement-controller.ref
            replacement-controller.spdx.json
            waycloak-cni.ref
            waycloak-cni.spdx.json
            waycloak-node-agent.ref
            waycloak-node-agent.spdx.json
            waycloak-gateway-agent.ref
            waycloak-gateway-agent.spdx.json
            waycloak-chart.ref
            waycloak-chart.spdx.json
            "waycloak-${RELEASE_TAG#v}.tgz"
          )
          for artifact in "${expected[@]}"; do
            test -f "$artifact"
          done
          sha256sum --check core-SHA256SUMS

          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/core-release.yaml@refs/tags/${RELEASE_TAG}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob \
            --bundle core-release-manifest.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            core-release-manifest.json
          cosign verify-blob \
            --bundle core-SHA256SUMS.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            core-SHA256SUMS

          jq -e --arg version "$RELEASE_TAG" '.version == $version and .apiVersion == "release.waycloak.io/v1"' core-release-manifest.json
          test "$(jq -r '.chart.repository + "@" + .chart.digest' core-release-manifest.json)" = "$(cat waycloak-chart.ref)"
          for pair in \
            gluetun:gluetun.ref \
            replacement-controller:replacement-controller.ref \
            waycloak-cni:waycloak-cni.ref \
            waycloak-node-agent:waycloak-node-agent.ref \
            waycloak-gateway-agent:waycloak-gateway-agent.ref; do
            name="${pair%%:*}"
            ref_file="${pair#*:}"
            test "$(jq -r --arg name "$name" '.images[$name].repository + "@" + .images[$name].digest' core-release-manifest.json)" = "$(cat "$ref_file")"
          done
      - name: Verify OCI signatures, SBOM attestations, provenance, and platforms
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: ${{ runner.temp }}/published
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/core-release.yaml@refs/tags/${RELEASE_TAG}"
          issuer="https://token.actions.githubusercontent.com"
          for ref_file in gluetun.ref replacement-controller.ref waycloak-cni.ref waycloak-node-agent.ref waycloak-gateway-agent.ref; do
            reference="$(cat "$ref_file")"
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$reference"
            cosign verify-attestation --type spdxjson --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$reference"
            docker buildx imagetools inspect "$reference" --raw | jq -e \
              '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
            gh attestation verify "oci://$reference" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/core-release.yaml" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

          gluetun_reference="$(cat gluetun.ref)"
          for architecture in amd64 arm64; do
            expected_checksum="$(awk -v architecture="$architecture" \
              '$2 == "bin/gluetun-entrypoint-linux-" architecture {print $1}' \
              gluetun-binaries.SHA256SUMS)"
            [[ "$expected_checksum" =~ ^[a-f0-9]{64}$ ]]
            docker pull --platform "linux/$architecture" "$gluetun_reference"
            test "$(docker image inspect "$gluetun_reference" --format '{{index .Config.Labels "io.waycloak.gluetun.upstream-commit"}}')" = 7eed6eaf160440724a93ca66f66055068cebe4ac
            test "$(docker image inspect "$gluetun_reference" --format '{{index .Config.Labels "io.waycloak.gluetun.upstream-image"}}')" = docker.io/qmcgaw/gluetun@sha256:e3272b29a4bc177b389fbdcb54cf9716ccbfc30f04d8b7a35b0a5be9cdb58461
            container_id="$(docker create --platform "linux/$architecture" "$gluetun_reference")"
            docker cp "$container_id:/gluetun-entrypoint" "$RUNNER_TEMP/gluetun-entrypoint-linux-$architecture"
            docker rm "$container_id"
            printf '%s  %s\n' "$expected_checksum" "$RUNNER_TEMP/gluetun-entrypoint-linux-$architecture" | sha256sum --check
          done

          chart_reference="$(sed 's|^oci://||' waycloak-chart.ref)"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$chart_reference"
          cosign verify-attestation --type spdxjson --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$chart_reference"
          gh attestation verify "oci://$chart_reference" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/core-release.yaml" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Verify downloadable provenance and exact chart contents
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: ${{ runner.temp }}/published
        run: |
          while read -r artifact; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/core-release.yaml" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done < <(awk '{print $2}' core-SHA256SUMS)
          gh attestation verify core-SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/core-release.yaml" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

          mkdir pulled
          helm pull "$(cat waycloak-chart.ref)" --destination pulled
          cmp "waycloak-${RELEASE_TAG#v}.tgz" "pulled/waycloak-${RELEASE_TAG#v}.tgz"
          test "$(tar -tzf "waycloak-${RELEASE_TAG#v}.tgz" | grep -Ec '^waycloak/crds/networking\.waycloak\.io_(portforwardleases|vpnegressroutes|vpngatewayclasses|vpngateways|vpnworkloadbindings|workloadadapters)\.yaml$')" -eq 6
          go test ./hack/corerelease ./internal/waycloakctl
