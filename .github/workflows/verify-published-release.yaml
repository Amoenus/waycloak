name: Verify published Waycloak release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable Waycloak release tag to verify
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Check out verifier from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag and resolve exact source commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bash hack/validate-release-tag.sh "$RELEASE_TAG"
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ ! "$source_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "release tag did not resolve to an exact commit" >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >>"$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install checksummed KCL CLI
        run: bash hack/install-kcl.sh
      - name: Install pinned registry verifier
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
          echo "$GOBIN" >>"$GITHUB_PATH"
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/published"
      - name: Verify exact published Waycloak release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          bash hack/verify-release.sh \
            "$RELEASE_TAG" \
            "$SOURCE_SHA" \
            "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/published"
