name: waycloakctl release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  GOTOOLCHAIN: go1.26.6+auto

jobs:
  publish:
    if: github.repository == 'Amoenus/waycloak'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the immutable Waycloak release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash hack/validate-release-tag.sh "$RELEASE_TAG"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Reproducibly build every supported CLI artifact twice
        env:
          WAYCLOAK_VERSION: ${{ github.ref_name }}
        run: |
          make waycloakctl-release WAYCLOAKCTL_DIST="$RUNNER_TEMP/first" WAYCLOAK_VERSION="$WAYCLOAK_VERSION"
          make waycloakctl-release WAYCLOAKCTL_DIST="$RUNNER_TEMP/second" WAYCLOAK_VERSION="$WAYCLOAK_VERSION"
          diff --recursive --no-dereference "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          mkdir -p dist/waycloakctl
          cp "$RUNNER_TEMP/first"/* dist/waycloakctl/
          mv dist/waycloakctl/SHA256SUMS dist/waycloakctl/waycloakctl-SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/waycloakctl
          format: spdx-json
          output-file: dist/waycloakctl/waycloakctl.spdx.json
          upload-artifact: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign exact checksums and SBOM with GitHub OIDC
        run: |
          cosign sign-blob --yes --bundle dist/waycloakctl/waycloakctl-SHA256SUMS.sigstore.json dist/waycloakctl/waycloakctl-SHA256SUMS
          cosign sign-blob --yes --bundle dist/waycloakctl/waycloakctl.spdx.sigstore.json dist/waycloakctl/waycloakctl.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/waycloakctl/waycloakctl-darwin-*
            dist/waycloakctl/waycloakctl-linux-*
            dist/waycloakctl/waycloakctl-windows-*
            dist/waycloakctl/waycloakctl-SHA256SUMS
            dist/waycloakctl/waycloakctl.spdx.json
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash hack/publish-release-assets.sh "$RELEASE_TAG" \
            dist/waycloakctl/waycloakctl-darwin-* \
            dist/waycloakctl/waycloakctl-linux-* \
            dist/waycloakctl/waycloakctl-windows-* \
            dist/waycloakctl/waycloakctl-SHA256SUMS \
            dist/waycloakctl/waycloakctl-SHA256SUMS.sigstore.json \
            dist/waycloakctl/waycloakctl.spdx.json \
            dist/waycloakctl/waycloakctl.spdx.sigstore.json

  verify-published-assets:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the exact published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/published"
      - name: Verify checksums, signatures, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: ${{ runner.temp }}/published
        run: |
          expected=(
            waycloakctl-SHA256SUMS
            waycloakctl-SHA256SUMS.sigstore.json
            waycloakctl.spdx.json
            waycloakctl.spdx.sigstore.json
            waycloakctl-darwin-amd64
            waycloakctl-darwin-arm64
            waycloakctl-linux-amd64
            waycloakctl-linux-arm64
            waycloakctl-windows-amd64.exe
          )
          for asset in "${expected[@]}"; do
            test -f "$asset"
          done
          sha256sum --check waycloakctl-SHA256SUMS

          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/waycloakctl-release.yaml@refs/tags/${RELEASE_TAG}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob \
            --bundle waycloakctl-SHA256SUMS.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            waycloakctl-SHA256SUMS
          cosign verify-blob \
            --bundle waycloakctl.spdx.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            waycloakctl.spdx.json

          artifacts=(
            waycloakctl-darwin-amd64
            waycloakctl-darwin-arm64
            waycloakctl-linux-amd64
            waycloakctl-linux-arm64
            waycloakctl-windows-amd64.exe
            waycloakctl-SHA256SUMS
            waycloakctl.spdx.json
          )
          for artifact in "${artifacts[@]}"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/waycloakctl-release.yaml" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
