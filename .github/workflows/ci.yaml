name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.6+auto

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          base="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --check "$base" "$GITHUB_SHA"
          git diff --name-only "$base" "$GITHUB_SHA" >"$RUNNER_TEMP/changed-paths"
          full=false
          while IFS= read -r path; do
            case "$path" in
              AGENTS.md|LICENSE|README.md|PROJECT_STATUS.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md)
                ;;
              *)
                full=true
                ;;
            esac
          done <"$RUNNER_TEMP/changed-paths"
          printf 'full=%s\n' "$full" >>"$GITHUB_OUTPUT"
          {
            printf '### CI path classification\n\n'
            printf "Full verification required: \`%s\`\n\n" "$full"
            while IFS= read -r path; do
              printf -- "- \`%s\`\n" "$path"
            done <"$RUNNER_TEMP/changed-paths"
          } >>"$GITHUB_STEP_SUMMARY"

  verify:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install checksummed KCL CLI
        run: bash hack/install-kcl.sh
      - name: Install checksummed security tools
        run: bash hack/install-security-tools.sh
      - name: Verify exact dependency governance inventory
        run: make dependency-audit
      - name: Report upstream dependency drift
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./hack/dependencyaudit --upstream | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify formatting, tests, race detector, vet, and static analysis
        run: |
          test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          go test ./...
          go test -race ./...
          go vet ./...
          go vet -tags=e2e,envtest ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags=e2e,envtest ./...
      - name: Prove atomic SingleActive port-forward packet path
        run: |
          sudo env "PATH=$PATH" WAYCLOAK_E2E_PORT_FORWARD_NETNS=1 \
            go test -tags=e2e ./internal/portforward \
              -run '^TestGatewayPortForwardTCPUDPReturnSymmetryHandoffAndWithdrawal$' \
              -v -count=1 -timeout=2m
      - name: Prove baseline gateway fail-closed packet path
        run: |
          sudo env "PATH=$PATH" WAYCLOAK_E2E_GATEWAY_NETNS=1 \
            go test -tags=e2e ./internal/gatewaydataplane \
              -run '^TestGatewayBaselineFailClosedTCPUDPAndTunnelLoss$' \
              -v -count=1 -timeout=2m
      - name: Verify reproducible cross-platform waycloakctl artifacts
        run: |
          make waycloakctl-release WAYCLOAKCTL_DIST="$RUNNER_TEMP/waycloakctl-1" WAYCLOAK_VERSION=v0.0.0-ci
          make waycloakctl-release WAYCLOAKCTL_DIST="$RUNNER_TEMP/waycloakctl-2" WAYCLOAK_VERSION=v0.0.0-ci
          diff --recursive --no-dereference "$RUNNER_TEMP/waycloakctl-1" "$RUNNER_TEMP/waycloakctl-2"
      - name: Verify reproducible multi-platform release runtime images
        run: |
          for build in 1 2; do
            make release-runtime-images-oci \
              REPLACEMENT_CONTROLLER_OCI_LAYOUT="$RUNNER_TEMP/core-$build/controller" \
              WAYCLOAK_CNI_OCI_LAYOUT="$RUNNER_TEMP/core-$build/cni" \
              NODE_AGENT_OCI_LAYOUT="$RUNNER_TEMP/core-$build/node-agent" \
              GATEWAY_AGENT_OCI_LAYOUT="$RUNNER_TEMP/core-$build/gateway-agent" \
              GATEWAY_RUNTIME_OCI_LAYOUT="$RUNNER_TEMP/core-$build/gateway-runtime" \
              QBITTORRENT_ADAPTER_OCI_LAYOUT="$RUNNER_TEMP/core-$build/qbittorrent-adapter" \
              REPLACEMENT_CONTROLLER_IMAGE_REPOSITORY=waycloak.invalid/replacement-controller \
              WAYCLOAK_CNI_IMAGE_REPOSITORY=waycloak.invalid/waycloak-cni \
              NODE_AGENT_IMAGE_REPOSITORY=waycloak.invalid/waycloak-node-agent \
              GATEWAY_AGENT_IMAGE_REPOSITORY=waycloak.invalid/waycloak-gateway-agent \
              GATEWAY_RUNTIME_IMAGE_REPOSITORY=waycloak.invalid/waycloak-gateway-runtime \
              QBITTORRENT_ADAPTER_IMAGE_REPOSITORY=waycloak.invalid/waycloak-qbittorrent-adapter
          done
          diff --recursive --no-dereference "$RUNNER_TEMP/core-1" "$RUNNER_TEMP/core-2"
          for name in controller cni node-agent gateway-agent gateway-runtime qbittorrent-adapter; do
            layout="$RUNNER_TEMP/core-1/$name"
            test -f "$layout/oci-layout"
            test -f "$layout/index.json"
            root_digest="$(jq -er '.manifests | select(length == 1) | .[0].digest' "$layout/index.json")"
            root_index="$layout/blobs/sha256/${root_digest#sha256:}"
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' "$root_index"
            case "$name" in
              controller) entrypoint=/ko-app/replacement-controller ;;
              cni) entrypoint=/ko-app/waycloak-cni ;;
              node-agent) entrypoint=/ko-app/waycloak-node-agent ;;
              gateway-agent) entrypoint=/ko-app/waycloak-gateway-agent ;;
              gateway-runtime) entrypoint=/ko-app/waycloak-gateway-runtime ;;
              qbittorrent-adapter) entrypoint=/ko-app/waycloak-qbittorrent-adapter ;;
            esac
            while read -r image_digest; do
              image_manifest="$layout/blobs/sha256/${image_digest#sha256:}"
              config_digest="$(jq -er '.config.digest' "$image_manifest")"
              image_config="$layout/blobs/sha256/${config_digest#sha256:}"
              jq -e --arg entrypoint "$entrypoint" '.config.Entrypoint == [$entrypoint]' "$image_config"
            done < <(jq -r '.manifests[].digest' "$root_index")
          done
      - name: Verify deterministic Waycloak release-manifest assembly
        run: |
          for release_tag in v0.1.0-beta.1 v0.1.0-rc.1 v1.0.0; do
            bash hack/validate-release-tag.sh "$release_tag"
          done
          for release_tag in v0.0.0-core.20 v01.0.0 v1.0.0-beta.01 v1.0.0-rc.01 latest; do
            if bash hack/validate-release-tag.sh "$release_tag"; then
              echo "invalid release tag was accepted: $release_tag" >&2
              exit 1
            fi
          done
          digest_a="sha256:$(printf 'a%.0s' {1..64})"
          digest_b="sha256:$(printf 'b%.0s' {1..64})"
          digest_c="sha256:$(printf 'c%.0s' {1..64})"
          digest_d="sha256:$(printf 'd%.0s' {1..64})"
          digest_e="sha256:$(printf 'e%.0s' {1..64})"
          digest_f="sha256:$(printf 'f%.0s' {1..64})"
          manifest_args=(
            --version v0.0.0-ci
            --chart "oci://registry.invalid/charts/waycloak@$digest_a"
            --kcl "oci://registry.invalid/waycloak-kcl@$digest_f"
            --image "replacement-controller=registry.invalid/replacement-controller@$digest_b"
            --image "waycloak-cni=registry.invalid/waycloak-cni@$digest_c"
            --image "waycloak-node-agent=registry.invalid/waycloak-node-agent@$digest_d"
            --image "waycloak-gateway-agent=registry.invalid/waycloak-gateway-agent@$digest_e"
            --image "gluetun=docker.io/qmcgaw/gluetun@$digest_f"
            --image "pause=registry.k8s.io/pause@$digest_a"
            --image "waycloak-gateway-runtime=registry.invalid/waycloak-gateway-runtime@$digest_b"
            --image "waycloak-qbittorrent-adapter=registry.invalid/waycloak-qbittorrent-adapter@$digest_c"
          )
          go run ./hack/release "${manifest_args[@]}" >"$RUNNER_TEMP/release-manifest-1.json"
          go run ./hack/release "${manifest_args[@]}" >"$RUNNER_TEMP/release-manifest-2.json"
          cmp "$RUNNER_TEMP/release-manifest-1.json" "$RUNNER_TEMP/release-manifest-2.json"
          jq -e --arg digest_f "$digest_f" '
            .apiVersion == "release.waycloak.io/v1" and
            .version == "v0.0.0-ci" and
            (.manifestDigest | test("^sha256:[a-f0-9]{64}$")) and
            .kcl == {"repository":"oci://registry.invalid/waycloak-kcl","digest":$digest_f} and
            (.images | keys | sort == ["gluetun", "pause", "replacement-controller", "waycloak-cni", "waycloak-gateway-agent", "waycloak-gateway-runtime", "waycloak-node-agent", "waycloak-qbittorrent-adapter"])
          ' "$RUNNER_TEMP/release-manifest-1.json"
          bash hack/validate-release-inventory.sh "$RUNNER_TEMP/release-manifest-1.json"
          jq 'del(.images["waycloak-gateway-runtime"], .images["waycloak-qbittorrent-adapter"])' \
            "$RUNNER_TEMP/release-manifest-1.json" >"$RUNNER_TEMP/release-manifest-six-image.json"
          jq 'del(.images.pause)' \
            "$RUNNER_TEMP/release-manifest-1.json" >"$RUNNER_TEMP/release-manifest-missing-pause.json"
          jq '.images.extra = .images.pause' \
            "$RUNNER_TEMP/release-manifest-1.json" >"$RUNNER_TEMP/release-manifest-extra.json"
          for invalid in six-image missing-pause extra; do
            if bash hack/validate-release-inventory.sh "$RUNNER_TEMP/release-manifest-${invalid}.json"; then
              echo "invalid ${invalid} release inventory was accepted" >&2
              exit 1
            fi
          done
      - name: Verify generated CRDs, RBAC, API reference, and chart copies
        run: make verify-generated verify-workflows
      - name: Reject unlisted alpha contracts
        run: make alpha-audit
      - name: Verify frozen replacement API boundary
        run: make api-freeze-audit
      - name: Verify deterministic Helm rendering and package
        run: |
          helm lint charts/waycloak
          render_args=(waycloak charts/waycloak --namespace waycloak-system --include-crds)
          helm template "${render_args[@]}" >"$RUNNER_TEMP/render-1.yaml"
          helm template "${render_args[@]}" >"$RUNNER_TEMP/render-2.yaml"
          cmp "$RUNNER_TEMP/render-1.yaml" "$RUNNER_TEMP/render-2.yaml"
          asset_args=(waycloak charts/waycloak --namespace waycloak-system --set observability.assets.enabled=true)
          helm template "${asset_args[@]}" >"$RUNNER_TEMP/observability-1.yaml"
          helm template "${asset_args[@]}" >"$RUNNER_TEMP/observability-2.yaml"
          cmp "$RUNNER_TEMP/observability-1.yaml" "$RUNNER_TEMP/observability-2.yaml"
          test "$(grep -c '^kind: ConfigMap$' "$RUNNER_TEMP/observability-1.yaml")" -eq 2
          grep -q 'WaycloakEnrolledPodFailClosed' "$RUNNER_TEMP/observability-1.yaml"
          grep -q 'waycloak-stable-overview' "$RUNNER_TEMP/observability-1.yaml"
          test "$(grep -c '^kind: CustomResourceDefinition$' "$RUNNER_TEMP/render-1.yaml")" -eq 6
          test "$(grep -c '^kind: ValidatingAdmissionPolicy$' "$RUNNER_TEMP/render-1.yaml")" -eq 2
          test "$(grep -c '^kind: ValidatingAdmissionPolicyBinding$' "$RUNNER_TEMP/render-1.yaml")" -eq 2
          test "$(grep -c '^kind: MutatingAdmissionPolicy$' "$RUNNER_TEMP/render-1.yaml")" -eq 1
          test "$(grep -c '^kind: MutatingAdmissionPolicyBinding$' "$RUNNER_TEMP/render-1.yaml")" -eq 1
          awk '
            $0 == "kind: MutatingAdmissionPolicy" { in_policy = 1 }
            in_policy && $0 == "    matchPolicy: Equivalent" { match_policy++ }
            in_policy && $0 == "    namespaceSelector: {}" { namespace_selector++ }
            in_policy && $0 == "    objectSelector: {}" { object_selector++ }
            in_policy && $0 == "---" { in_policy = 0 }
            END {
              exit !(match_policy == 1 && namespace_selector == 1 && object_selector == 1)
            }
          ' "$RUNNER_TEMP/render-1.yaml"
          test "$(grep -c '^kind: Deployment$' "$RUNNER_TEMP/render-1.yaml" || true)" -eq 0
          test "$(grep -Ec '^kind: (Mutating|Validating)WebhookConfiguration$' "$RUNNER_TEMP/render-1.yaml" || true)" -eq 0
          if grep -q 'v1alpha' "$RUNNER_TEMP/render-1.yaml"; then
            echo "rendered chart contains a v1alpha API marker" >&2
            exit 1
          fi
          if grep -Eq 'mutate-v1-pod|waycloak-(prepare|verify)|allocation-configmap|port-forward-delivery-digest' "$RUNNER_TEMP/render-1.yaml"; then
            echo "rendered chart contains a removed alpha runtime contract" >&2
            exit 1
          fi
          digest="sha256:$(printf 'a%.0s' {1..64})"
          enabled_args=(waycloak charts/waycloak --namespace waycloak-system --include-crds
            --set-string releaseIdentity.version=v0.0.0-ci
            --set-string releaseIdentity.manifestDigest="$digest"
            --set controller.enabled=true
            --set-string controller.image.digest="$digest"
            --set-string controller.observationTLSSecret=waycloak-observation-tls
            --set-string controller.gateway.engineImage.digest="$digest"
            --set-string controller.gateway.agentImage.digest="$digest"
            --set-string controller.gateway.overlayCIDR=100.96.0.0/16
            --set-string controller.gateway.clusterDNS.serviceIP=10.96.0.10
            --set-string controller.gateway.clusterDNS.domain=cluster.local
            --set cniInstaller.enabled=true
            --set-string cniInstaller.image.digest="$digest"
            --set-string cniInstaller.pauseImage.digest="$digest"
            --set-string cniInstaller.configHostPath=/etc/cni/net.d/10-kindnet.conflist
            --set-string cniInstaller.binaryHostPath=/opt/cni/bin/waycloak-cni
            --set nodeAgent.enabled=true
            --set-string nodeAgent.image.digest="$digest"
            --set-string nodeAgent.observationRelayURL=https://waycloak-controller.waycloak-system.svc:9443/node-observations/v1/report
            --set-string nodeAgent.observationCASecret=waycloak-observation-ca
            --set-string nodeAgent.cniReceiptHostPath=/var/lib/cni/waycloak/install-receipt.json
            --set-string nodeAgent.cniBinaryHostPath=/opt/cni/bin/waycloak-cni
            --set-string nodeAgent.cniConfigHostPath=/etc/cni/net.d/10-kindnet.conflist
            --set-string nodeAgent.releaseIdentity.version=v0.0.0-ci
            --set-string nodeAgent.releaseIdentity.manifestDigest="$digest"
            --set defaultGatewayClass.enabled=true
            --set-string defaultGatewayClass.releaseIdentity.version=v0.0.0-ci
            --set-string defaultGatewayClass.releaseIdentity.manifestDigest="$digest")
          helm template "${enabled_args[@]}" >"$RUNNER_TEMP/enabled-1.yaml"
          helm template "${enabled_args[@]}" >"$RUNNER_TEMP/enabled-2.yaml"
          cmp "$RUNNER_TEMP/enabled-1.yaml" "$RUNNER_TEMP/enabled-2.yaml"
          grep -q -- '--metrics-bind-address=:8080' "$RUNNER_TEMP/enabled-1.yaml"
          test "$(grep -c '^ *- name: metrics$' "$RUNNER_TEMP/enabled-1.yaml")" -eq 2
          disabled_metrics_args=("${enabled_args[@]}" --set observability.metrics.enabled=false)
          helm template "${disabled_metrics_args[@]}" >"$RUNNER_TEMP/metrics-disabled.yaml"
          grep -q -- '--metrics-bind-address=0' "$RUNNER_TEMP/metrics-disabled.yaml"
          test "$(grep -c '^ *- name: metrics$' "$RUNNER_TEMP/metrics-disabled.yaml" || true)" -eq 0
          test "$(grep -c '^kind: Deployment$' "$RUNNER_TEMP/enabled-1.yaml")" -eq 1
          test "$(grep -c '^kind: DaemonSet$' "$RUNNER_TEMP/enabled-1.yaml")" -eq 2
          test "$(grep -c '^kind: VPNGatewayClass$' "$RUNNER_TEMP/enabled-1.yaml")" -eq 1
          test "$(grep -c '^    argocd.argoproj.io/sync-wave: \"-100\"$' "$RUNNER_TEMP/enabled-1.yaml")" -eq 1
          test "$(grep -c '^kind: Secret$' "$RUNNER_TEMP/enabled-1.yaml" || true)" -eq 0
          test "$(grep -c '@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' "$RUNNER_TEMP/enabled-1.yaml")" -ge 5
          grep -A4 'securityContext:' "$RUNNER_TEMP/enabled-1.yaml" | grep -q 'fsGroup: 65532'
          test "$(grep -c -- '/var/lib/cni/waycloak/attachments' "$RUNNER_TEMP/enabled-1.yaml")" -eq 2
          test "$(grep -c -- '/var/lib/cni/waycloak/install-receipt.json' "$RUNNER_TEMP/enabled-1.yaml")" -eq 1
          test "$(grep -c '^      hostNetwork: true$' "$RUNNER_TEMP/enabled-1.yaml")" -eq 2
          test "$(grep -c '^      dnsPolicy: ClusterFirstWithHostNet$' "$RUNNER_TEMP/enabled-1.yaml")" -eq 2
          if grep -Eq 'waycloak-port-forward|gateway-port-forward-runtime-image|ghcr.io/amoenus/waycloak-gateway-runtime@sha256:' "$RUNNER_TEMP/enabled-1.yaml"; then
            echo "baseline chart rendering contains a port-forward runtime surface" >&2
            exit 1
          fi
          core_port_forward_features="$(grep -c 'networking.waycloak.io/PortForwardServiceSingleActive' "$RUNNER_TEMP/enabled-1.yaml" || true)"
          core_adapter_features="$(grep -c 'networking.waycloak.io/WorkloadAdapter' "$RUNNER_TEMP/enabled-1.yaml" || true)"
          port_forward_args=("${enabled_args[@]}"
            --set portForwarding.enabled=true
            --set-string portForwarding.controllerTLSSecret=waycloak-port-forward-controller-tls
            --set-string portForwarding.gatewayRuntime.image.digest="$digest"
            --set portForwarding.adapter.enabled=true)
          helm template "${port_forward_args[@]}" >"$RUNNER_TEMP/port-forward-1.yaml"
          helm template "${port_forward_args[@]}" >"$RUNNER_TEMP/port-forward-2.yaml"
          cmp "$RUNNER_TEMP/port-forward-1.yaml" "$RUNNER_TEMP/port-forward-2.yaml"
          grep -q -- '--gateway-port-forward-runtime-image=ghcr.io/amoenus/waycloak-gateway-runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' "$RUNNER_TEMP/port-forward-1.yaml"
          grep -q -- '--port-forward-runtime-ca=/var/run/secrets/waycloak-port-forward/ca.crt' "$RUNNER_TEMP/port-forward-1.yaml"
          grep -q -- '--adapter-ca=/var/run/secrets/waycloak-port-forward/ca.crt' "$RUNNER_TEMP/port-forward-1.yaml"
          grep -q 'secretName: waycloak-port-forward-controller-tls' "$RUNNER_TEMP/port-forward-1.yaml"
          test "$(grep -c 'networking.waycloak.io/PortForwardServiceSingleActive' "$RUNNER_TEMP/port-forward-1.yaml")" -eq "$((core_port_forward_features + 1))"
          test "$(grep -c 'networking.waycloak.io/WorkloadAdapter' "$RUNNER_TEMP/port-forward-1.yaml")" -eq "$((core_adapter_features + 1))"
          grep -q 'conformanceProfile: networking.waycloak.io/Core-v1' "$RUNNER_TEMP/port-forward-1.yaml"
          if helm template "${enabled_args[@]}" \
            --set portForwarding.enabled=true \
            >"$RUNNER_TEMP/port-forward-partial.yaml" 2>"$RUNNER_TEMP/port-forward-partial.err"; then
            echo "partial port-forward configuration rendered successfully" >&2
            exit 1
          fi
          grep -q 'portForwarding.gatewayRuntime.image.digest is required' "$RUNNER_TEMP/port-forward-partial.err"
          if helm template "${enabled_args[@]}" --set portForwarding.adapter.enabled=true >"$RUNNER_TEMP/adapter-without-runtime.yaml" 2>"$RUNNER_TEMP/adapter-without-runtime.err"; then
            echo "adapter-only port-forward configuration rendered successfully" >&2
            exit 1
          fi
          grep -q 'portForwarding.adapter.enabled requires portForwarding.enabled=true' "$RUNNER_TEMP/adapter-without-runtime.err"
          if helm template "${enabled_args[@]}" --set extended.enabled=true >"$RUNNER_TEMP/removed-tier.yaml" 2>"$RUNNER_TEMP/removed-tier.err"; then
            echo "removed tier configuration rendered successfully" >&2
            exit 1
          fi
          grep -q "additional properties 'extended' not allowed" "$RUNNER_TEMP/removed-tier.err"
          mkdir -p "$RUNNER_TEMP/chart-1" "$RUNNER_TEMP/chart-2"
          helm package charts/waycloak --destination "$RUNNER_TEMP/chart-1"
          helm package charts/waycloak --destination "$RUNNER_TEMP/chart-2"
          chart_version="$(awk '$1 == "version:" {print $2; exit}' charts/waycloak/Chart.yaml)"
          cmp "$RUNNER_TEMP/chart-1/waycloak-$chart_version.tgz" "$RUNNER_TEMP/chart-2/waycloak-$chart_version.tgz"
          test "$(tar -tzf "$RUNNER_TEMP/chart-1/waycloak-$chart_version.tgz" | grep -Ec '^waycloak/crds/networking\.waycloak\.io_(portforwardleases|vpnegressroutes|vpngatewayclasses|vpngateways|vpnworkloadbindings|workloadadapters)\.yaml$')" -eq 6
      - name: Verify Prometheus rules and scrape configuration
        run: |
          archive="$RUNNER_TEMP/prometheus-3.13.2.linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-amd64.tar.gz
          echo '0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f  '"$archive" | sha256sum --check
          tar -xzf "$archive" --directory "$RUNNER_TEMP"
          promtool="$RUNNER_TEMP/prometheus-3.13.2.linux-amd64/promtool"
          "$promtool" check rules charts/waycloak/files/observability/prometheus-rules.yaml
          "$promtool" check config config/observability/prometheus-scrape.yaml
      - name: Verify KCL rendering and deterministic package
        run: |
          module_version="$(awk '$1 == "version" {gsub(/\"/, "", $3); print $3; exit}' kcl/waycloak/kcl.mod)"
          test "$module_version" = "$(awk '$1 == "version:" {print $2; exit}' charts/waycloak/Chart.yaml)"
          kcl run kcl/waycloak/examples/basic.k -S items >"$RUNNER_TEMP/kcl-example.yaml"
          kcl run kcl/waycloak/examples/private-egress.k -S items >"$RUNNER_TEMP/kcl-private-egress-example.yaml"
          kcl run kcl/waycloak/examples/workload-adapter.k -S items >"$RUNNER_TEMP/kcl-workload-adapter-example.yaml"
          test "$(grep -c '^kind: VPNGatewayClass$' "$RUNNER_TEMP/kcl-example.yaml")" -eq 1
          test "$(grep -c '^kind: VPNGateway$' "$RUNNER_TEMP/kcl-example.yaml")" -eq 1
          test "$(grep -c '^kind: VPNEgressRoute$' "$RUNNER_TEMP/kcl-private-egress-example.yaml")" -eq 1
          test "$(grep -c '^kind: Deployment$' "$RUNNER_TEMP/kcl-private-egress-example.yaml")" -eq 1
          grep -q 'networking.waycloak.io/egress-route: private' "$RUNNER_TEMP/kcl-private-egress-example.yaml"
          test "$(grep -c '^kind: WorkloadAdapter$' "$RUNNER_TEMP/kcl-workload-adapter-example.yaml")" -eq 1
          mkdir -p "$RUNNER_TEMP/kcl-1" "$RUNNER_TEMP/kcl-2"
          (cd kcl/waycloak && kcl mod pkg --target "$RUNNER_TEMP/kcl-1")
          (cd kcl/waycloak && kcl mod pkg --target "$RUNNER_TEMP/kcl-2")
          cmp "$RUNNER_TEMP/kcl-1/waycloak_${module_version}.tar" "$RUNNER_TEMP/kcl-2/waycloak_${module_version}.tar"
          test "$(tar -tf "$RUNNER_TEMP/kcl-1/waycloak_${module_version}.tar" | grep -Ec '^v1beta1/networking_waycloak_io_v1beta1_(port_forward_lease|v_p_n_egress_route|v_p_n_gateway|v_p_n_gateway_class|v_p_n_workload_binding|workload_adapter)\.k$')" -eq 6
          if tar -tf "$RUNNER_TEMP/kcl-1/waycloak_${module_version}.tar" | grep -q 'v1alpha'; then
            echo "KCL package contains a v1alpha API marker" >&2
            exit 1
          fi
      - name: Run envtest reconciliation
        run: |
          KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.2-0.20260522131650-4e7b752653a0 use -p path 1.36.x)"
          export KUBEBUILDER_ASSETS
          go test -tags=envtest ./test/replacementapi/... -v -count=1
      - name: Scan source and dependencies
        run: |
          gitleaks git --redact --no-banner
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  gluetun-candidate:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install checksummed security tools
        run: bash hack/install-security-tools.sh
      - name: Install upstream privileged test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iptables
          xt_mark="$(find /usr/lib -path '*/xtables/libxt_mark.so' -print -quit)"
          test -f "$xt_mark"
          sudo install -d /usr/lib/xtables
          if [[ ! -e /usr/lib/xtables/libxt_mark.so ]]; then
            sudo ln --symbolic "$xt_mark" /usr/lib/xtables/libxt_mark.so
          fi
          test -f /usr/lib/xtables/libxt_mark.so
      - name: Rebuild and test the exact patched Gluetun source twice
        run: |
          upstream_commit=3d1e20c5551e9cae1f9d938dc7b7214a6987f27e
          for build in first second; do
            source_dir="$RUNNER_TEMP/gluetun-source-$build"
            git init "$source_dir"
            git -C "$source_dir" remote add origin https://github.com/passteque/gluetun.git
            git -C "$source_dir" fetch --depth=1 origin "$upstream_commit"
            git -C "$source_dir" checkout --detach FETCH_HEAD
            test "$(git -C "$source_dir" rev-parse HEAD)" = "$upstream_commit"
            GO=go bash hack/build-gluetun-candidate.sh \
              "$source_dir" "$RUNNER_TEMP/gluetun-$build" \
              "$upstream_commit" v0.1.0-beta.0
          done
          diff --recursive --no-dereference "$RUNNER_TEMP/gluetun-first" "$RUNNER_TEMP/gluetun-second"
          # Test_leakCheck calls an uncontrolled third-party JSON API whose
          # response shape is not a Gluetun or Waycloak contract. Compile the
          # package and run every deterministic upstream test; Waycloak's own
          # packet/DNS suites and credentialed local-cluster gate own leak proof.
          upstream_test_args=(-skip '^Test_leakCheck$')
          if ! (cd "$RUNNER_TEMP/gluetun-source-first" && sudo env "PATH=$PATH" GOWORK=off go test "${upstream_test_args[@]}" ./...); then
            echo "upstream suite failed once; retrying the complete suite once" >&2
            (cd "$RUNNER_TEMP/gluetun-source-first" && sudo env "PATH=$PATH" GOWORK=off go test "${upstream_test_args[@]}" ./...)
          fi
          go version -m "$RUNNER_TEMP/gluetun-first/bin/gluetun-entrypoint-linux-amd64" | tee "$RUNNER_TEMP/gluetun-modules"
          grep -q $'dep\tgolang.org/x/text\tv0.41.0\t' "$RUNNER_TEMP/gluetun-modules"
          grep -q $'dep\tgithub.com/cloudflare/circl\tv1.6.5\t' "$RUNNER_TEMP/gluetun-modules"
      - name: Build and scan the derived image
        run: |
          docker buildx build \
            --file build/gluetun-candidate/Dockerfile \
            --platform=linux/amd64 \
            --build-arg UPSTREAM_IMAGE=docker.io/qmcgaw/gluetun@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027 \
            --build-arg GLUETUN_UPSTREAM_COMMIT=3d1e20c5551e9cae1f9d938dc7b7214a6987f27e \
            --build-arg WAYCLOAK_RELEASE=v0.1.0-beta.0 \
            --build-arg "WAYCLOAK_SOURCE_COMMIT=$GITHUB_SHA" \
            --provenance=false \
            --sbom=false \
            --tag waycloak-gluetun:test \
            --load \
            "$RUNNER_TEMP/gluetun-first"
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 waycloak-gluetun:test
          test "$(docker image inspect waycloak-gluetun:test --format '{{index .Config.Labels "io.waycloak.gluetun.upstream-commit"}}')" = 3d1e20c5551e9cae1f9d938dc7b7214a6987f27e
          test "$(docker image inspect waycloak-gluetun:test --format '{{index .Config.Labels "io.waycloak.gluetun.upstream-image"}}')" = docker.io/qmcgaw/gluetun@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          docker run --rm --entrypoint /bin/sh waycloak-gluetun:test -c \
            'test -x /gluetun-entrypoint && test -f /licenses/gluetun/LICENSE && test -s /licenses/gluetun/gluetun-dependency.patch && test -r /etc/waycloak/gluetun-control-auth.toml'
          docker run --rm --entrypoint cat waycloak-gluetun:test \
            /etc/waycloak/gluetun-control-auth.toml | cmp - build/gluetun-candidate/control-auth.toml

  kind-e2e:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Create pinned Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: waycloak-ci
          version: v0.33.0
          node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          wait: 120s
      - name: Run replacement API fresh-install acceptance
        env:
          WAYCLOAK_E2E_REPLACEMENT_API: "1"
        run: |
          WAYCLOAK_E2E_ALPHA_PURGE=1 go test -tags=e2e ./test/e2e/... \
            -run '^TestAlphaPurgeInterruptedDrillBeforeFreshReplacement$' \
            -v -count=1 -timeout=10m
          go test -tags=e2e ./test/e2e/... \
            -run '^TestReplacementAPIFreshInstall$' \
            -v -count=1 -timeout=10m
      - name: Run privileged packet, drift, DNS, and gateway-loss acceptance
        run: |
          go test -tags=e2e ./test/e2e/... \
            -run '^(TestFailClosedLockdownInPodNetworkNamespace|TestVXLANPathAndGatewayLossFailClosed)$' \
            -v -count=1 -timeout=20m

