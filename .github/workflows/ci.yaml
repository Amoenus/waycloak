name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          base="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --check "$base" "$GITHUB_SHA"
          git diff --name-only "$base" "$GITHUB_SHA" >"$RUNNER_TEMP/changed-paths"
          full=false
          while IFS= read -r path; do
            case "$path" in
              AGENTS.md|LICENSE|README.md|PROJECT_STATUS.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md)
                ;;
              *)
                full=true
                ;;
            esac
          done <"$RUNNER_TEMP/changed-paths"
          printf 'full=%s\n' "$full" >>"$GITHUB_OUTPUT"
          {
            printf '### CI path classification\n\n'
            printf "Full verification required: \`%s\`\n\n" "$full"
            while IFS= read -r path; do
              printf -- "- \`%s\`\n" "$path"
            done <"$RUNNER_TEMP/changed-paths"
          } >>"$GITHUB_STEP_SUMMARY"

  verify:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.1
      - name: Install checksummed KCL CLI
        run: bash hack/install-kcl.sh
      - name: Install checksummed security tools
        run: bash hack/install-security-tools.sh
      - name: Verify formatting, tests, race detector, vet, and static analysis
        run: |
          test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          go test ./...
          go test -race ./...
          go vet ./...
          go vet -tags=e2e,envtest ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -tags=e2e,envtest ./...
      - name: Verify generated CRDs, RBAC, API reference, and chart copies
        run: make verify-generated verify-workflows
      - name: Reject unlisted alpha contracts
        run: make alpha-audit
      - name: Verify frozen replacement API boundary
        run: make api-freeze-audit
      - name: Verify deterministic Helm rendering and package
        run: |
          helm lint charts/waycloak
          render_args=(waycloak charts/waycloak --namespace waycloak-system --include-crds)
          helm template "${render_args[@]}" >"$RUNNER_TEMP/render-1.yaml"
          helm template "${render_args[@]}" >"$RUNNER_TEMP/render-2.yaml"
          cmp "$RUNNER_TEMP/render-1.yaml" "$RUNNER_TEMP/render-2.yaml"
          test "$(grep -c '^kind: CustomResourceDefinition$' "$RUNNER_TEMP/render-1.yaml")" -eq 6
          test "$(grep -c '^kind: ValidatingAdmissionPolicy$' "$RUNNER_TEMP/render-1.yaml")" -eq 2
          test "$(grep -c '^kind: ValidatingAdmissionPolicyBinding$' "$RUNNER_TEMP/render-1.yaml")" -eq 2
          test "$(grep -c '^kind: MutatingAdmissionPolicy$' "$RUNNER_TEMP/render-1.yaml")" -eq 1
          test "$(grep -c '^kind: MutatingAdmissionPolicyBinding$' "$RUNNER_TEMP/render-1.yaml")" -eq 1
          test "$(grep -c '^kind: Deployment$' "$RUNNER_TEMP/render-1.yaml" || true)" -eq 0
          test "$(grep -Ec '^kind: (Mutating|Validating)WebhookConfiguration$' "$RUNNER_TEMP/render-1.yaml" || true)" -eq 0
          if grep -q 'v1alpha' "$RUNNER_TEMP/render-1.yaml"; then
            echo "rendered chart contains a v1alpha API marker" >&2
            exit 1
          fi
          if grep -Eq 'mutate-v1-pod|waycloak-(prepare|verify)|allocation-configmap|port-forward-delivery-digest' "$RUNNER_TEMP/render-1.yaml"; then
            echo "rendered chart contains a removed alpha runtime contract" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/chart-1" "$RUNNER_TEMP/chart-2"
          helm package charts/waycloak --destination "$RUNNER_TEMP/chart-1"
          helm package charts/waycloak --destination "$RUNNER_TEMP/chart-2"
          chart_version="$(awk '$1 == "version:" {print $2; exit}' charts/waycloak/Chart.yaml)"
          cmp "$RUNNER_TEMP/chart-1/waycloak-$chart_version.tgz" "$RUNNER_TEMP/chart-2/waycloak-$chart_version.tgz"
          test "$(tar -tzf "$RUNNER_TEMP/chart-1/waycloak-$chart_version.tgz" | grep -Ec '^waycloak/crds/networking\.waycloak\.io_(portforwardleases|vpnegressroutes|vpngatewayclasses|vpngateways|vpnworkloadbindings|workloadadapters)\.yaml$')" -eq 6
      - name: Verify KCL rendering and deterministic package
        run: |
          module_version="$(awk '$1 == "version" {gsub(/\"/, "", $3); print $3; exit}' kcl/waycloak/kcl.mod)"
          test "$module_version" = "$(awk '$1 == "version:" {print $2; exit}' charts/waycloak/Chart.yaml)"
          kcl run kcl/waycloak/examples/basic.k -S items >"$RUNNER_TEMP/kcl-example.yaml"
          kcl run kcl/waycloak/examples/private-egress.k -S items >"$RUNNER_TEMP/kcl-private-egress-example.yaml"
          kcl run kcl/waycloak/examples/workload-adapter.k -S items >"$RUNNER_TEMP/kcl-workload-adapter-example.yaml"
          test "$(grep -c '^kind: VPNGatewayClass$' "$RUNNER_TEMP/kcl-example.yaml")" -eq 1
          test "$(grep -c '^kind: VPNGateway$' "$RUNNER_TEMP/kcl-example.yaml")" -eq 1
          test "$(grep -c '^kind: VPNEgressRoute$' "$RUNNER_TEMP/kcl-private-egress-example.yaml")" -eq 1
          test "$(grep -c '^kind: Deployment$' "$RUNNER_TEMP/kcl-private-egress-example.yaml")" -eq 1
          grep -q 'networking.waycloak.io/egress-route: private' "$RUNNER_TEMP/kcl-private-egress-example.yaml"
          test "$(grep -c '^kind: WorkloadAdapter$' "$RUNNER_TEMP/kcl-workload-adapter-example.yaml")" -eq 1
          mkdir -p "$RUNNER_TEMP/kcl-1" "$RUNNER_TEMP/kcl-2"
          (cd kcl/waycloak && kcl mod pkg --target "$RUNNER_TEMP/kcl-1")
          (cd kcl/waycloak && kcl mod pkg --target "$RUNNER_TEMP/kcl-2")
          cmp "$RUNNER_TEMP/kcl-1/waycloak_${module_version}.tar" "$RUNNER_TEMP/kcl-2/waycloak_${module_version}.tar"
          test "$(tar -tf "$RUNNER_TEMP/kcl-1/waycloak_${module_version}.tar" | grep -Ec '^v1beta1/networking_waycloak_io_v1beta1_(port_forward_lease|v_p_n_egress_route|v_p_n_gateway|v_p_n_gateway_class|v_p_n_workload_binding|workload_adapter)\.k$')" -eq 6
          if tar -tf "$RUNNER_TEMP/kcl-1/waycloak_${module_version}.tar" | grep -q 'v1alpha'; then
            echo "KCL package contains a v1alpha API marker" >&2
            exit 1
          fi
      - name: Run envtest reconciliation
        run: |
          KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.2-0.20260522131650-4e7b752653a0 use -p path 1.36.x)"
          export KUBEBUILDER_ASSETS
          go test -tags=envtest ./test/replacementapi/... -v -count=1
      - name: Scan source and dependencies
        run: |
          gitleaks git --redact --no-banner
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  kind-e2e:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Create pinned Kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: waycloak-ci
          version: v0.32.0
          node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          wait: 120s
      - name: Run replacement API fresh-install acceptance
        env:
          WAYCLOAK_E2E_REPLACEMENT_API: "1"
        run: |
          go test -tags=e2e ./test/e2e/... \
            -run '^TestReplacementAPIFreshInstall$' \
            -v -count=1 -timeout=10m
      - name: Run privileged packet, drift, DNS, and gateway-loss acceptance
        run: |
          go test -tags=e2e ./test/e2e/... \
            -run '^(TestFailClosedLockdownInPodNetworkNamespace|TestVXLANPathAndGatewayLossFailClosed)$' \
            -v -count=1 -timeout=20m

  kind-cni-e2e:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Create pinned Kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: waycloak-cni-ci
          version: v0.32.0
          node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          wait: 120s
      - name: Run Kind and kindnet CNI feasibility proof with runtime restart
        env:
          WAYCLOAK_E2E_CNI: "1"
          WAYCLOAK_E2E_CNI_RESTART_RUNTIME_COMMAND: docker exec waycloak-cni-ci-control-plane systemctl restart containerd
        run: |
          go test -tags=e2e ./test/e2e/... \
            -run '^TestChainedCNICreationTimeFailClosed$' \
            -v -count=1 -timeout=10m

  k3d-cni-e2e:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install checksummed k3d
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/k3d" \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo '06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  '"$RUNNER_TEMP/k3d" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
      - name: Create pinned k3d cluster
        run: |
          k3d cluster create waycloak-ci \
            --image rancher/k3s:v1.36.1-k3s1@sha256:08fdebd14db9ab7d5ea821d5bfa95d02341a6ef886842fcc8d9dfd0e9fa9e0cd \
            --servers 1 \
            --agents 0 \
            --k3s-arg '--disable=traefik@server:0' \
            --wait \
            --timeout 120s
      - name: Run k3d k3s and Flannel CNI feasibility proof
        shell: bash
        run: |
          node_name="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          WAYCLOAK_E2E_CNI=1 \
          WAYCLOAK_E2E_CNI_NODE="$node_name" \
          WAYCLOAK_E2E_CNI_CONFIG_DIR=/var/lib/rancher/k3s/agent/etc/cni/net.d \
          WAYCLOAK_E2E_CNI_CONFIG_NAME=10-flannel.conflist \
          WAYCLOAK_E2E_CNI_BIN_DIR=/var/lib/rancher/k3s/data/cni \
            go test -tags=e2e ./test/e2e/... \
              -run '^TestChainedCNICreationTimeFailClosed$' \
              -v -count=1 -timeout=20m
      - name: Remove k3d cluster
        if: always()
        run: k3d cluster delete waycloak-ci
