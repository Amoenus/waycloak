name: Waycloak release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: waycloak-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.26.6+auto

jobs:
  publish:
    if: github.repository == 'Amoenus/waycloak'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    outputs:
      chart_digest: ${{ steps.publish-chart.outputs.digest }}
      chart_repository: ${{ steps.publish-chart.outputs.repository }}
      coredns_digest: ${{ steps.publish-coredns.outputs.digest }}
      coredns_repository: ${{ steps.publish-coredns.outputs.repository }}
      gateway_agent_digest: ${{ steps.publish-images.outputs.gateway_agent_digest }}
      gateway_agent_repository: ${{ steps.publish-images.outputs.gateway_agent_repository }}
      gateway_runtime_digest: ${{ steps.publish-images.outputs.gateway_runtime_digest }}
      gateway_runtime_repository: ${{ steps.publish-images.outputs.gateway_runtime_repository }}
      gluetun_digest: ${{ steps.publish-gluetun.outputs.digest }}
      gluetun_repository: ${{ steps.publish-gluetun.outputs.repository }}
      kcl_digest: ${{ steps.publish-kcl.outputs.digest }}
      kcl_repository: ${{ steps.publish-kcl.outputs.repository }}
      node_agent_digest: ${{ steps.publish-images.outputs.node_agent_digest }}
      node_agent_repository: ${{ steps.publish-images.outputs.node_agent_repository }}
      replacement_controller_digest: ${{ steps.publish-images.outputs.replacement_controller_digest }}
      replacement_controller_repository: ${{ steps.publish-images.outputs.replacement_controller_repository }}
      qbittorrent_adapter_digest: ${{ steps.publish-images.outputs.qbittorrent_adapter_digest }}
      qbittorrent_adapter_repository: ${{ steps.publish-images.outputs.qbittorrent_adapter_repository }}
      waycloak_cni_digest: ${{ steps.publish-images.outputs.waycloak_cni_digest }}
      waycloak_cni_repository: ${{ steps.publish-images.outputs.waycloak_cni_repository }}
    steps:
      - name: Check out exact Waycloak release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the immutable Waycloak release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash hack/validate-release-tag.sh "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install checksummed security tools
        run: bash hack/install-security-tools.sh
      - name: Install checksummed KCL CLI
        run: bash hack/install-kcl.sh
      - name: Install upstream privileged test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iptables
          xt_mark="$(find /usr/lib -path '*/xtables/libxt_mark.so' -print -quit)"
          test -f "$xt_mark"
          sudo install -d /usr/lib/xtables
          if [[ ! -e /usr/lib/xtables/libxt_mark.so ]]; then
            sudo ln --symbolic "$xt_mark" /usr/lib/xtables/libxt_mark.so
          fi
          test -f /usr/lib/xtables/libxt_mark.so
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Set up the multi-platform container builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Reproduce the multi-platform release images before publication
        run: |
          for build in first second; do
            make release-runtime-images-oci \
              REPLACEMENT_CONTROLLER_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/controller" \
              WAYCLOAK_CNI_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/cni" \
              NODE_AGENT_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/node-agent" \
              GATEWAY_AGENT_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/gateway-agent" \
              GATEWAY_RUNTIME_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/gateway-runtime" \
              QBITTORRENT_ADAPTER_OCI_LAYOUT="$RUNNER_TEMP/repro-$build/qbittorrent-adapter" \
              REPLACEMENT_CONTROLLER_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-replacement-controller \
              WAYCLOAK_CNI_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-cni \
              NODE_AGENT_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-node-agent \
              GATEWAY_AGENT_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-gateway-agent \
              GATEWAY_RUNTIME_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-gateway-runtime \
              QBITTORRENT_ADAPTER_IMAGE_REPOSITORY=ghcr.io/amoenus/waycloak-qbittorrent-adapter
          done
          diff --recursive --no-dereference "$RUNNER_TEMP/repro-first" "$RUNNER_TEMP/repro-second"
      - name: Publish first-party images and capture only exact digests
        id: publish-images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/release
          release_version="${RELEASE_TAG#v}"

          publish_image() {
            local key="$1" name="$2" repository="$3" import_path="$4"
            local refs_file="$RUNNER_TEMP/${name}.refs"
            KO_DOCKER_REPO="$repository" go run github.com/google/ko@v0.19.1 build \
              --bare \
              --tags "$release_version" \
              --platform=linux/amd64,linux/arm64 \
              --sbom=spdx \
              --image-refs "$refs_file" \
              "$import_path"
            local reference tag_digest
            local -a references
            mapfile -t references <"$refs_file"
            if [[ "${#references[@]}" -ne 3 ]]; then
              echo "publisher did not return one index and two platform references for ${name}" >&2
              exit 1
            fi
            reference="${references[0]}"
            if [[ ! "$reference" =~ ^${repository}@sha256:[a-f0-9]{64}$ ]]; then
              echo "publisher did not return one exact ${name} digest" >&2
              exit 1
            fi
            for child_reference in "${references[@]:1}"; do
              [[ "$child_reference" =~ ^${repository}@sha256:[a-f0-9]{64}$ ]]
            done
            tag_digest="$(docker buildx imagetools inspect "$repository:$release_version" | awk '$1 == "Digest:" {print $2; exit}')"
            test "$tag_digest" = "${reference#*@}"
            printf '%s\n' "$reference" >"dist/release/${name}.ref"
            {
              printf '%s_repository=%s\n' "$key" "$repository"
              printf '%s_digest=%s\n' "$key" "${reference#*@}"
            } >>"$GITHUB_OUTPUT"
          }

          publish_image replacement_controller replacement-controller ghcr.io/amoenus/waycloak-replacement-controller ./cmd/replacement-controller
          publish_image waycloak_cni waycloak-cni ghcr.io/amoenus/waycloak-cni ./cmd/waycloak-cni
          publish_image node_agent waycloak-node-agent ghcr.io/amoenus/waycloak-node-agent ./cmd/waycloak-node-agent
          publish_image gateway_agent waycloak-gateway-agent ghcr.io/amoenus/waycloak-gateway-agent ./cmd/waycloak-gateway-agent
          publish_image gateway_runtime waycloak-gateway-runtime ghcr.io/amoenus/waycloak-gateway-runtime ./cmd/waycloak-gateway-runtime
          publish_image qbittorrent_adapter waycloak-qbittorrent-adapter ghcr.io/amoenus/waycloak-qbittorrent-adapter ./cmd/waycloak-qbittorrent-adapter
      - name: Build, test, and publish the vulnerability-gated Gluetun derivative
        id: publish-gluetun
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          upstream_commit=3d1e20c5551e9cae1f9d938dc7b7214a6987f27e
          servers_commit=0c7381faba8b0ef5d59caec11eae7ef629f6b4c9
          upstream_image=docker.io/qmcgaw/gluetun@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          repository=ghcr.io/amoenus/waycloak-gluetun
          release_version="${RELEASE_TAG#v}"

          checkout_upstream() {
            local destination="$1"
            git init "$destination"
            git -C "$destination" remote add origin https://github.com/passteque/gluetun.git
            git -C "$destination" fetch --depth=1 origin "$upstream_commit"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$upstream_commit"
          }

          checkout_upstream "$RUNNER_TEMP/gluetun-source-first"
          checkout_upstream "$RUNNER_TEMP/gluetun-source-second"
          checkout_servers() {
            local destination="$1"
            git init "$destination"
            git -C "$destination" remote add origin https://github.com/qdm12/gluetun-servers.git
            git -C "$destination" fetch --depth=1 origin "$servers_commit"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$servers_commit"
          }
          checkout_servers "$RUNNER_TEMP/gluetun-servers-first"
          checkout_servers "$RUNNER_TEMP/gluetun-servers-second"
          GO=go bash hack/build-gluetun-candidate.sh \
            "$RUNNER_TEMP/gluetun-source-first" "$RUNNER_TEMP/gluetun-servers-first" "$RUNNER_TEMP/gluetun-first" \
            "$upstream_commit" "$servers_commit" "$RELEASE_TAG"
          GO=go bash hack/build-gluetun-candidate.sh \
            "$RUNNER_TEMP/gluetun-source-second" "$RUNNER_TEMP/gluetun-servers-second" "$RUNNER_TEMP/gluetun-second" \
            "$upstream_commit" "$servers_commit" "$RELEASE_TAG"
          diff --recursive --no-dereference "$RUNNER_TEMP/gluetun-first" "$RUNNER_TEMP/gluetun-second"
          if ! (cd "$RUNNER_TEMP/gluetun-source-first" && sudo env "PATH=$PATH" GOWORK=off go test ./...); then
            echo "upstream suite failed once; retrying the complete suite once" >&2
            (cd "$RUNNER_TEMP/gluetun-source-first" && sudo env "PATH=$PATH" GOWORK=off go test ./...)
          fi

          docker buildx build \
            --file build/gluetun-candidate/Dockerfile \
            --platform=linux/amd64,linux/arm64 \
            --build-arg "UPSTREAM_IMAGE=$upstream_image" \
            --build-arg "GLUETUN_UPSTREAM_COMMIT=$upstream_commit" \
            --build-arg "GLUETUN_SERVERS_COMMIT=$servers_commit" \
            --build-arg "WAYCLOAK_RELEASE=$RELEASE_TAG" \
            --build-arg "WAYCLOAK_SOURCE_COMMIT=$GITHUB_SHA" \
            --provenance=false \
            --sbom=false \
            --tag "$repository:$release_version" \
            --push \
            "$RUNNER_TEMP/gluetun-first"
          digest="$(docker buildx imagetools inspect "$repository:$release_version" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "derived Gluetun publisher did not return one exact index digest" >&2
            exit 1
          fi
          printf '%s@%s\n' "$repository" "$digest" >dist/release/gluetun.ref
          cp "$RUNNER_TEMP/gluetun-first/gluetun-dependency.patch" dist/release/
          cp "$RUNNER_TEMP/gluetun-first/gluetun-servers.LICENSE" dist/release/
          cp "$RUNNER_TEMP/gluetun-first/gluetun-servers.ref" dist/release/
          cp "$RUNNER_TEMP/gluetun-first/gluetun-servers.SHA256SUMS" dist/release/
          cp "$RUNNER_TEMP/gluetun-first/control-auth.toml" dist/release/gluetun-control-auth.toml
          cp "$RUNNER_TEMP/gluetun-first/LICENSE" dist/release/gluetun.LICENSE
          cp "$RUNNER_TEMP/gluetun-first/gluetun-binaries.SHA256SUMS" dist/release/
          {
            printf 'repository=%s\n' "$repository"
            printf 'digest=%s\n' "$digest"
          } >>"$GITHUB_OUTPUT"
      - name: Build, test, and publish the vulnerability-fixed CoreDNS derivative
        id: publish-coredns
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          upstream_commit=427fc80ed9ca47f354585eb30a3f1332950856c4
          upstream_image=docker.io/coredns/coredns@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
          x_crypto_version=v0.55.0
          x_mod_version=v0.40.0
          repository=ghcr.io/amoenus/waycloak-coredns
          release_version="${RELEASE_TAG#v}"

          checkout_upstream() {
            local destination="$1"
            git init "$destination"
            git -C "$destination" remote add origin https://github.com/coredns/coredns.git
            git -C "$destination" fetch --depth=1 origin "$upstream_commit"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$upstream_commit"
          }

          checkout_upstream "$RUNNER_TEMP/coredns-source-first"
          checkout_upstream "$RUNNER_TEMP/coredns-source-second"
          bash hack/build-coredns-candidate.sh \
            "$RUNNER_TEMP/coredns-source-first" "$RUNNER_TEMP/coredns-first" \
            "$upstream_commit" "$x_crypto_version" "$x_mod_version" "$RELEASE_TAG"
          bash hack/build-coredns-candidate.sh \
            "$RUNNER_TEMP/coredns-source-second" "$RUNNER_TEMP/coredns-second" \
            "$upstream_commit" "$x_crypto_version" "$x_mod_version" "$RELEASE_TAG"
          diff --recursive --no-dereference "$RUNNER_TEMP/coredns-first" "$RUNNER_TEMP/coredns-second"
          (cd "$RUNNER_TEMP/coredns-source-first" && GOWORK=off go test ./...)

          docker buildx build \
            --file build/coredns-candidate/Dockerfile \
            --platform=linux/amd64,linux/arm64 \
            --build-arg "UPSTREAM_IMAGE=$upstream_image" \
            --build-arg "COREDNS_UPSTREAM_COMMIT=$upstream_commit" \
            --build-arg "COREDNS_X_CRYPTO_VERSION=$x_crypto_version" \
            --build-arg "COREDNS_X_MOD_VERSION=$x_mod_version" \
            --build-arg "WAYCLOAK_RELEASE=$RELEASE_TAG" \
            --build-arg "WAYCLOAK_SOURCE_COMMIT=$GITHUB_SHA" \
            --provenance=false \
            --sbom=false \
            --tag "$repository:$release_version" \
            --push \
            "$RUNNER_TEMP/coredns-first"
          digest="$(docker buildx imagetools inspect "$repository:$release_version" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "derived CoreDNS publisher did not return one exact index digest" >&2
            exit 1
          fi
          printf '%s@%s\n' "$repository" "$digest" >dist/release/coredns.ref
          cp "$RUNNER_TEMP/coredns-first/coredns-dependency.patch" dist/release/
          cp "$RUNNER_TEMP/coredns-first/coredns-binaries.SHA256SUMS" dist/release/
          cp "$RUNNER_TEMP/coredns-first/coredns-source.ref" dist/release/
          cp "$RUNNER_TEMP/coredns-first/coredns.LICENSE" dist/release/
          {
            printf 'repository=%s\n' "$repository"
            printf 'digest=%s\n' "$digest"
          } >>"$GITHUB_OUTPUT"
      - name: Reproducibly package and publish the Helm chart
        id: publish-chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          repository="ghcr.io/amoenus/charts/waycloak"
          for build in first second; do
            mkdir -p "$RUNNER_TEMP/chart-$build"
            helm package charts/waycloak \
              --version "$release_version" \
              --app-version "$RELEASE_TAG" \
              --destination "$RUNNER_TEMP/chart-$build" >/dev/null
          done
          cmp "$RUNNER_TEMP/chart-first/waycloak-$release_version.tgz" "$RUNNER_TEMP/chart-second/waycloak-$release_version.tgz"
          cp "$RUNNER_TEMP/chart-first/waycloak-$release_version.tgz" dist/release/
          helm push "dist/release/waycloak-$release_version.tgz" oci://ghcr.io/amoenus/charts >"$RUNNER_TEMP/chart-push.txt"
          digest="$(awk '$1 == "Digest:" {print $2}' "$RUNNER_TEMP/chart-push.txt")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Helm did not return an exact chart digest" >&2
            exit 1
          fi
          printf 'oci://%s@%s\n' "$repository" "$digest" >dist/release/waycloak-chart.ref
          {
            printf 'repository=%s\n' "$repository"
            printf 'digest=%s\n' "$digest"
            printf 'package=%s\n' "dist/release/waycloak-$release_version.tgz"
          } >>"$GITHUB_OUTPUT"
      - name: Reproducibly package and publish the KCL OCI module
        id: publish-kcl
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          repository="ghcr.io/amoenus/waycloak-kcl"
          for build in first second; do
            cp -R kcl/waycloak "$RUNNER_TEMP/kcl-$build"
            sed -i -E 's/^version = "[^"]+"$/version = "'"$release_version"'"/' \
              "$RUNNER_TEMP/kcl-$build/kcl.mod"
            find "$RUNNER_TEMP/kcl-$build" -type f \
              -exec touch --date='2000-01-01T00:00:00Z' {} +
            mkdir -p "$RUNNER_TEMP/kcl-package-$build"
            (cd "$RUNNER_TEMP/kcl-$build" && \
              kcl mod pkg --target "$RUNNER_TEMP/kcl-package-$build")
          done
          first_package="$RUNNER_TEMP/kcl-package-first/waycloak_${release_version}.tar"
          second_package="$RUNNER_TEMP/kcl-package-second/waycloak_${release_version}.tar"
          cmp "$first_package" "$second_package"
          kcl run "$RUNNER_TEMP/kcl-first/examples/private-egress.k" -S items \
            >"$RUNNER_TEMP/kcl-example.yaml"
          test "$(grep -c '^kind: VPNEgressRoute$' "$RUNNER_TEMP/kcl-example.yaml")" -eq 1
          test "$(grep -c '^kind: Deployment$' "$RUNNER_TEMP/kcl-example.yaml")" -eq 1
          kcl run "$RUNNER_TEMP/kcl-first/examples/gitops-bootstrap-values.k" -S values \
            >"$RUNNER_TEMP/kcl-bootstrap-values.yaml"
          grep -Eq "^    overlayCIDR: ['\"]?100[.]96[.]0[.]0/16['\"]?$" \
            "$RUNNER_TEMP/kcl-bootstrap-values.yaml"
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$RUNNER_TEMP/kcl-first"
          (cd "$RUNNER_TEMP/kcl-first" && kcl mod push "oci://$repository")
          digest="$(go run github.com/google/go-containerregistry/cmd/crane@v0.22.0 \
            digest "$repository:$release_version")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "KCL did not return an exact module digest" >&2
            exit 1
          fi
          printf 'oci://%s@%s\n' "$repository" "$digest" >dist/release/waycloak-kcl.ref
          cp "$first_package" "dist/release/waycloak-kcl-${RELEASE_TAG}.tar"
          {
            printf 'repository=%s\n' "$repository"
            printf 'digest=%s\n' "$digest"
          } >>"$GITHUB_OUTPUT"
      - name: Generate replacement-controller SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish-images.outputs.replacement_controller_repository }}@${{ steps.publish-images.outputs.replacement_controller_digest }}
          format: spdx-json
          output-file: dist/release/replacement-controller.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CNI SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish-images.outputs.waycloak_cni_repository }}@${{ steps.publish-images.outputs.waycloak_cni_digest }}
          format: spdx-json
          output-file: dist/release/waycloak-cni.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate node-agent SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish-images.outputs.node_agent_repository }}@${{ steps.publish-images.outputs.node_agent_digest }}
          format: spdx-json
          output-file: dist/release/waycloak-node-agent.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate gateway-agent SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish-images.outputs.gateway_agent_repository }}@${{ steps.publish-images.outputs.gateway_agent_digest }}
          format: spdx-json
          output-file: dist/release/waycloak-gateway-agent.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate gateway-runtime SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish-images.outputs.gateway_runtime_repository }}@${{ steps.publish-images.outputs.gateway_runtime_digest }}
          format: spdx-json
          output-file: dist/release/waycloak-gateway-runtime.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate qBittorrent adapter SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish-images.outputs.qbittorrent_adapter_repository }}@${{ steps.publish-images.outputs.qbittorrent_adapter_digest }}
          format: spdx-json
          output-file: dist/release/waycloak-qbittorrent-adapter.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate Gluetun derivative SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish-gluetun.outputs.repository }}@${{ steps.publish-gluetun.outputs.digest }}
          format: spdx-json
          output-file: dist/release/gluetun.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CoreDNS SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish-coredns.outputs.repository }}@${{ steps.publish-coredns.outputs.digest }}
          format: spdx-json
          output-file: dist/release/coredns.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate chart SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.publish-chart.outputs.package }}
          format: spdx-json
          output-file: dist/release/waycloak-chart.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate KCL module SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/release/waycloak-kcl-${{ github.ref_name }}.tar
          format: spdx-json
          output-file: dist/release/waycloak-kcl.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Enforce the release vulnerability policy
        run: |
          while read -r reference; do
            if [[ "$reference" == ghcr.io/amoenus/waycloak-coredns@sha256:* ]]; then
              trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                --ignorefile security/coredns-v1.14.7.trivyignore.yaml --show-suppressed \
                --exit-code 1 "$reference"
            else
              trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$reference"
            fi
          # Scan only runtime OCI identities. Source-provenance .ref assets are
          # intentionally not image names and must never enter the image scanner.
          done < <(cat \
            dist/release/replacement-controller.ref \
            dist/release/waycloak-cni.ref \
            dist/release/waycloak-node-agent.ref \
            dist/release/waycloak-gateway-agent.ref \
            dist/release/waycloak-gateway-runtime.ref \
            dist/release/waycloak-qbittorrent-adapter.ref \
            dist/release/gluetun.ref \
            dist/release/coredns.ref)
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            registry.k8s.io/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Assemble the canonical exact Waycloak release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          go run ./hack/release \
            --version "$RELEASE_TAG" \
            --chart "$(cat dist/release/waycloak-chart.ref)" \
            --kcl "$(cat dist/release/waycloak-kcl.ref)" \
            --image "replacement-controller=$(cat dist/release/replacement-controller.ref)" \
            --image "waycloak-cni=$(cat dist/release/waycloak-cni.ref)" \
            --image "waycloak-node-agent=$(cat dist/release/waycloak-node-agent.ref)" \
            --image "waycloak-gateway-agent=$(cat dist/release/waycloak-gateway-agent.ref)" \
            --image "waycloak-gateway-runtime=$(cat dist/release/waycloak-gateway-runtime.ref)" \
            --image "waycloak-qbittorrent-adapter=$(cat dist/release/waycloak-qbittorrent-adapter.ref)" \
            --image "gluetun=$(cat dist/release/gluetun.ref)" \
            --image "coredns=$(cat dist/release/coredns.ref)" \
            --image pause=registry.k8s.io/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c \
            >dist/release/release-manifest.json
      - name: Generate the certified GitOps bootstrap values
        run: |
          go run ./hack/gitopsvalues \
            --release-manifest dist/release/release-manifest.json \
            --profile k3s-flannel-amd64 \
            >dist/release/waycloak-values-k3s-flannel-amd64.yaml
          go run ./hack/gitopsvalues \
            --release-manifest dist/release/release-manifest.json \
            --profile k3s-flannel-amd64 \
            --format flux \
            --overlay-cidr 100.96.0.0/16 \
            >dist/release/waycloak-flux-k3s-flannel-amd64.yaml
          go run ./hack/gitopsvalues \
            --release-manifest dist/release/release-manifest.json \
            --profile k3s-flannel-amd64 \
            --format argocd \
            --overlay-cidr 100.96.0.0/16 \
            >dist/release/waycloak-argocd-k3s-flannel-amd64.yaml
      - name: Attach the verified dependency qualification inventory
        run: |
          go run ./hack/dependencyaudit
          cp dependencies/dependency-inventory.json dist/release/dependency-inventory.json
      - name: Sign exact OCI identities, SBOM attestations, and release inventory
        run: |
          sign_image() {
            local reference="$1" predicate="$2"
            bash hack/cosign-retry.sh sign --yes "$reference"
            bash hack/cosign-retry.sh attest --yes --type spdxjson --predicate "$predicate" "$reference"
          }
          sign_image "$(cat dist/release/replacement-controller.ref)" dist/release/replacement-controller.spdx.json
          sign_image "$(cat dist/release/waycloak-cni.ref)" dist/release/waycloak-cni.spdx.json
          sign_image "$(cat dist/release/waycloak-node-agent.ref)" dist/release/waycloak-node-agent.spdx.json
          sign_image "$(cat dist/release/waycloak-gateway-agent.ref)" dist/release/waycloak-gateway-agent.spdx.json
          sign_image "$(cat dist/release/waycloak-gateway-runtime.ref)" dist/release/waycloak-gateway-runtime.spdx.json
          sign_image "$(cat dist/release/waycloak-qbittorrent-adapter.ref)" dist/release/waycloak-qbittorrent-adapter.spdx.json
          sign_image "$(cat dist/release/gluetun.ref)" dist/release/gluetun.spdx.json
          sign_image "$(cat dist/release/coredns.ref)" dist/release/coredns.spdx.json

          chart_reference="$(sed 's|^oci://||' dist/release/waycloak-chart.ref)"
          sign_image "$chart_reference" dist/release/waycloak-chart.spdx.json
          kcl_reference="$(sed 's|^oci://||' dist/release/waycloak-kcl.ref)"
          sign_image "$kcl_reference" dist/release/waycloak-kcl.spdx.json
          bash hack/cosign-retry.sh sign-blob --yes \
            --bundle dist/release/release-manifest.sigstore.json \
            dist/release/release-manifest.json

          (cd dist/release && find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS*' -printf '%f\n' | sort | xargs sha256sum >SHA256SUMS)
          bash hack/cosign-retry.sh sign-blob --yes \
            --bundle dist/release/SHA256SUMS.sigstore.json \
            dist/release/SHA256SUMS
      - name: Attest replacement-controller provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-images.outputs.replacement_controller_repository }}
          subject-digest: ${{ steps.publish-images.outputs.replacement_controller_digest }}
          push-to-registry: true
      - name: Attest CNI provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-images.outputs.waycloak_cni_repository }}
          subject-digest: ${{ steps.publish-images.outputs.waycloak_cni_digest }}
          push-to-registry: true
      - name: Attest node-agent provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-images.outputs.node_agent_repository }}
          subject-digest: ${{ steps.publish-images.outputs.node_agent_digest }}
          push-to-registry: true
      - name: Attest gateway-agent provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-images.outputs.gateway_agent_repository }}
          subject-digest: ${{ steps.publish-images.outputs.gateway_agent_digest }}
          push-to-registry: true
      - name: Attest gateway-runtime provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-images.outputs.gateway_runtime_repository }}
          subject-digest: ${{ steps.publish-images.outputs.gateway_runtime_digest }}
          push-to-registry: true
      - name: Attest qBittorrent adapter provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-images.outputs.qbittorrent_adapter_repository }}
          subject-digest: ${{ steps.publish-images.outputs.qbittorrent_adapter_digest }}
          push-to-registry: true
      - name: Attest Gluetun derivative provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-gluetun.outputs.repository }}
          subject-digest: ${{ steps.publish-gluetun.outputs.digest }}
          push-to-registry: true
      - name: Attest CoreDNS derivative provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-coredns.outputs.repository }}
          subject-digest: ${{ steps.publish-coredns.outputs.digest }}
          push-to-registry: true
      - name: Attest chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-chart.outputs.repository }}
          subject-digest: ${{ steps.publish-chart.outputs.digest }}
          push-to-registry: true
      - name: Attest KCL module provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish-kcl.outputs.repository }}
          subject-digest: ${{ steps.publish-kcl.outputs.digest }}
          push-to-registry: true
      - name: Attest downloadable Waycloak artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Publish immutable Waycloak release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash hack/publish-release-assets.sh "$RELEASE_TAG" dist/release/*

  verify-published-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Check out exact Waycloak release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install checksummed KCL CLI
        run: bash hack/install-kcl.sh
      - name: Install pinned registry verifier
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
          echo "$GOBIN" >>"$GITHUB_PATH"
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Download the published candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/published"
      - name: Verify exact published Waycloak release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash hack/verify-release.sh \
            "$RELEASE_TAG" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/published"
