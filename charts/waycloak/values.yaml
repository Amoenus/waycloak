nameOverride: ""
fullnameOverride: ""

serviceAccount:
  annotations: {}

# A standard Helm pre-install hook can create the private observation
# identities required by a clean GitOps installation. Existing identities are
# validated and preserved. Release transitions and certificate rotation remain
# separate, fail-closed operations.
bootstrap:
  observationCertificates:
    enabled: false

observability:
  metrics:
    enabled: true
    port: 8080
  openTelemetry:
    otlpEndpoint: ""
    queueSize: 256
    exportInterval: 15s
    exportTimeout: 1s
  assets:
    enabled: false

releaseIdentity:
  version: ""
  manifestDigest: ""

controller:
  enabled: false
  image:
    repository: ghcr.io/amoenus/waycloak-replacement-controller
    digest: ""
  replicas: 1
  observationTLSSecret: ""
  observationPort: 9443
  conformanceProfile: networking.waycloak.io/Core-v1
  gateway:
    engineImage:
      repository: docker.io/qmcgaw/gluetun
      digest: ""
    agentImage:
      repository: ghcr.io/amoenus/waycloak-gateway-agent
      digest: ""
    coreDNSImage:
      repository: docker.io/coredns/coredns
      digest: ""
    overlayCIDR: ""
    clusterDNS:
      serviceIP: ""
      domain: ""
    vni: 7999
    mtu: 1320
    vxlanPort: 4789
    healthPort: 18080

# Provider port forwarding remains disabled until #137 real-provider
# SingleActive acceptance. Enabling it requires an exact gateway-runtime image and a pre-created
# controller mTLS Secret with ca.crt, tls.crt, tls.key. The out-of-process
# adapter image is declared exactly by its operator-authored WorkloadAdapter.
portForwarding:
  enabled: false
  controllerTLSSecret: ""
  gatewayRuntime:
    image:
      repository: ghcr.io/amoenus/waycloak-gateway-runtime
      digest: ""
    port: 9443
  adapter:
    enabled: false
    port: 9444

cniInstaller:
  enabled: false
  nodeSelector: {}
  image:
    repository: ghcr.io/amoenus/waycloak-cni
    digest: ""
  pauseImage:
    repository: registry.k8s.io/pause
    digest: ""
  configHostPath: ""
  binaryHostPath: ""
  receiptHostPath: /var/lib/cni/waycloak/install-receipt.json

# The signed install plan in #138 enables this surface and supplies the exact
# verified release-manifest identity. The API-only development chart does not
# invent or silently substitute a release digest.
defaultGatewayClass:
  enabled: false
  name: gluetun.waycloak.io
  releaseIdentity:
    version: ""
    manifestDigest: ""

# The #138 turnkey installer supplies exact signed image digests and relay TLS
# material before enabling this production DaemonSet. Keeping it disabled in
# the API-only chart stage avoids publishing a mutable or placeholder image.
nodeAgent:
  enabled: false
  observationRotationID: initial
  # Reserved for the confirmation-bound waycloakctl release transaction.
  # A held successor retains deny-first state under the source identity.
  observationCapabilityHold: false
  transitionPlanID: ""
  nodeSelector: {}
  image:
    repository: ghcr.io/amoenus/waycloak-node-agent
    digest: ""
  observationRelayURL: ""
  observationCASecret: ""
  # Exact root-owned files produced from the signed #138 install plan. The
  # runtime agent mounts them read-only and never installs or rewrites CNI.
  cniReceiptHostPath: ""
  cniBinaryHostPath: ""
  cniConfigHostPath: ""
  reconcileInterval: 5s
  conformanceProfile: networking.waycloak.io/Core-v1
  releaseIdentity:
    version: ""
    manifestDigest: ""
  # During a confirmation-bound transition the held target agent continues to
  # advertise the source authority while validating the exact target CNI.
  cniReleaseIdentity:
    version: ""
    manifestDigest: ""
