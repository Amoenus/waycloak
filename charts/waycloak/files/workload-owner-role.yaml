---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: waycloak-workload-owner
rules:
- apiGroups:
  - networking.waycloak.io
  resources:
  - portforwardleases
  - vpnegressroutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.waycloak.io
  resources:
  - vpnworkloadbindings
  - workloadadapters
  verbs:
  - get
  - list
  - watch
