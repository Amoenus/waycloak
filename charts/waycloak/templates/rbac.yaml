{{- $generatedRole := .Files.Get "files/controller-role.yaml" | fromYaml -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "waycloak.fullname" . }}
  labels:
    {{- include "waycloak.labels" . | nindent 4 }}
rules:
  {{- toYaml $generatedRole.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "waycloak.fullname" . }}
  labels:
    {{- include "waycloak.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "waycloak.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "waycloak.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- range $path := list "files/distribution-role.yaml" "files/network-operator-role.yaml" "files/workload-owner-role.yaml" "files/adapter-operator-role.yaml" "files/node-agent-role.yaml" }}
{{- $personaRole := $.Files.Get $path | fromYaml }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $personaRole.metadata.name }}
  labels:
    {{- include "waycloak.labels" $ | nindent 4 }}
rules:
  {{- toYaml $personaRole.rules | nindent 2 }}
{{- end }}
