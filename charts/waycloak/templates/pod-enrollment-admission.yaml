apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ include "waycloak.fullname" . }}-pod-scheduling
  labels:
    {{- include "waycloak.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
  matchConditions:
    - name: explicitly-enrolled
      expression: >-
        has(object.metadata.labels) &&
        "networking.waycloak.io/egress-route" in object.metadata.labels
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.nodeSelector) ?
          [JSONPatch{op: "add", path: "/spec/nodeSelector/" +
          jsonpatch.escapeKey("networking.waycloak.io.node-restriction.kubernetes.io/cni-ready"),
          value: "true"}] :
          [JSONPatch{op: "add", path: "/spec/nodeSelector",
          value: {"networking.waycloak.io.node-restriction.kubernetes.io/cni-ready": "true"}}]
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !has(object.spec.dnsConfig) ?
          [JSONPatch{op: "add", path: "/spec/dnsConfig", value: {"options": [{"name": "ndots", "value": "1"}]}}] :
          !has(object.spec.dnsConfig.options) ?
          [JSONPatch{op: "add", path: "/spec/dnsConfig/options", value: [{"name": "ndots", "value": "1"}]}] :
          !object.spec.dnsConfig.options.exists(option, option.name == "ndots") ?
          [JSONPatch{op: "add", path: "/spec/dnsConfig/options/-", value: {"name": "ndots", "value": "1"}}] : []
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ include "waycloak.fullname" . }}-pod-scheduling
  labels:
    {{- include "waycloak.labels" . | nindent 4 }}
spec:
  policyName: {{ include "waycloak.fullname" . }}-pod-scheduling
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "waycloak.fullname" . }}-pod-enrollment
  labels:
    {{- include "waycloak.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
  validations:
    - expression: >-
        !has(object.metadata.annotations) ||
        object.metadata.annotations.all(key, !key.startsWith("networking.waycloak.io/") &&
        !key.startsWith("internal.networking.waycloak.io/"))
      message: alpha Waycloak annotations are not accepted by the replacement API
      reason: Forbidden
    - expression: >-
        !has(object.metadata.labels) ||
        !("networking.waycloak.io/egress-route" in object.metadata.labels) ||
        object.metadata.labels["networking.waycloak.io/egress-route"].matches("^[a-z0-9]([-a-z0-9]*[a-z0-9])?$")
      message: the Waycloak egress-route label must contain one same-namespace DNS label
      reason: Invalid
    - expression: >-
        request.operation != "UPDATE" ||
        (has(object.metadata.labels) && "networking.waycloak.io/egress-route" in object.metadata.labels ?
        object.metadata.labels["networking.waycloak.io/egress-route"] : "") ==
        (has(oldObject.metadata.labels) && "networking.waycloak.io/egress-route" in oldObject.metadata.labels ?
        oldObject.metadata.labels["networking.waycloak.io/egress-route"] : "")
      message: enrollment on an existing Pod is immutable; update the Pod template and create a new Pod
      reason: Forbidden
    - expression: >-
        !has(object.metadata.labels) ||
        !("networking.waycloak.io/egress-route" in object.metadata.labels) ||
        ((!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
        (!has(object.spec.hostPID) || !object.spec.hostPID) &&
        (!has(object.spec.hostIPC) || !object.spec.hostIPC) &&
        (!has(object.spec.nodeName) || object.spec.nodeName == ""))
      message: enrolled Pods cannot bypass CNI or scheduler placement with host namespaces or spec.nodeName
      reason: Forbidden
    - expression: >-
        !has(object.metadata.labels) ||
        !("networking.waycloak.io/egress-route" in object.metadata.labels) ||
        (has(object.spec.nodeSelector) &&
        "networking.waycloak.io.node-restriction.kubernetes.io/cni-ready" in object.spec.nodeSelector &&
        object.spec.nodeSelector["networking.waycloak.io.node-restriction.kubernetes.io/cni-ready"] == "true")
      message: enrolled Pods require the Waycloak CNI-ready scheduling constraint
      reason: Forbidden
    - expression: >-
        !has(object.metadata.labels) ||
        !("networking.waycloak.io/egress-route" in object.metadata.labels) ||
        (has(object.spec.dnsConfig) && has(object.spec.dnsConfig.options) &&
        object.spec.dnsConfig.options.filter(option, option.name == "ndots").size() == 1 &&
        object.spec.dnsConfig.options.exists(option, option.name == "ndots" && has(option.value) && option.value == "1"))
      message: enrolled Pods require the release-owned ndots:1 DNS search bound
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "waycloak.fullname" . }}-pod-enrollment
  labels:
    {{- include "waycloak.labels" . | nindent 4 }}
spec:
  policyName: {{ include "waycloak.fullname" . }}-pod-enrollment
  validationActions: [Deny]
