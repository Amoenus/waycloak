{{- if .Values.nodeAgent.enabled }}
{{- $digest := required "nodeAgent.image.digest is required when nodeAgent.enabled=true" .Values.nodeAgent.image.digest }}
{{- $relayURL := required "nodeAgent.observationRelayURL is required when nodeAgent.enabled=true" .Values.nodeAgent.observationRelayURL }}
{{- $caSecret := required "nodeAgent.observationCASecret is required when nodeAgent.enabled=true" .Values.nodeAgent.observationCASecret }}
{{- $releaseVersion := required "nodeAgent.releaseIdentity.version is required when nodeAgent.enabled=true" .Values.nodeAgent.releaseIdentity.version }}
{{- $releaseDigest := required "nodeAgent.releaseIdentity.manifestDigest is required when nodeAgent.enabled=true" .Values.nodeAgent.releaseIdentity.manifestDigest }}
{{- $cniReceipt := required "nodeAgent.cniReceiptHostPath is required when nodeAgent.enabled=true" .Values.nodeAgent.cniReceiptHostPath }}
{{- $cniBinary := required "nodeAgent.cniBinaryHostPath is required when nodeAgent.enabled=true" .Values.nodeAgent.cniBinaryHostPath }}
{{- $cniConfig := required "nodeAgent.cniConfigHostPath is required when nodeAgent.enabled=true" .Values.nodeAgent.cniConfigHostPath }}
{{- $rotationID := required "nodeAgent.observationRotationID is required when nodeAgent.enabled=true" .Values.nodeAgent.observationRotationID }}
{{- if and .Values.nodeAgent.observationCapabilityHold (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.nodeAgent.transitionPlanID)) }}
{{- fail "nodeAgent.transitionPlanID must be an exact sha256 digest when observationCapabilityHold=true" }}
{{- end }}
{{- if and (not .Values.nodeAgent.observationCapabilityHold) (ne .Values.nodeAgent.transitionPlanID "") }}
{{- fail "nodeAgent.transitionPlanID requires observationCapabilityHold=true" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "waycloak.fullname" . }}-node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "waycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "waycloak.fullname" . }}-node-agent
  labels:
    {{- include "waycloak.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: waycloak-node-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "waycloak.fullname" . }}-node-agent
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "waycloak.fullname" . }}-node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "waycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      {{- include "waycloak.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-agent
  template:
    metadata:
      annotations:
        install.waycloak.io/observation-rotation-id: {{ $rotationID | quote }}
        {{ with .Values.nodeAgent.transitionPlanID }}
        install.waycloak.io/transition-plan-id: {{ . | quote }}
        {{ end }}
      labels:
        {{- include "waycloak.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node-agent
    spec:
      serviceAccountName: {{ include "waycloak.fullname" . }}-node-agent
      automountServiceAccountToken: false
      # The node agent is the local CNI authority. Running it in the host
      # network namespace avoids a bootstrap cycle in which its own sandbox
      # would require the not-yet-running agent through the chained plugin.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      {{- with .Values.nodeAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - operator: Exists
      containers:
        - name: node-agent
          image: "{{ .Values.nodeAgent.image.repository }}@{{ $digest }}"
          imagePullPolicy: IfNotPresent
          args:
            - --node-name=$(WAYCLOAK_NODE_NAME)
            - --observation-relay-url={{ $relayURL }}
            - --reconcile-interval={{ .Values.nodeAgent.reconcileInterval }}
            - --release-version={{ $releaseVersion }}
            - --release-manifest-digest={{ $releaseDigest }}
            - --conformance-profile={{ .Values.nodeAgent.conformanceProfile }}
            {{ if .Values.nodeAgent.observationCapabilityHold }}
            - --observation-capability-hold=true
            - --observation-capability-hold-id={{ .Values.nodeAgent.transitionPlanID }}
            {{ end }}
            - --state-dir=/var/lib/cni/waycloak/attachments
            - --cni-receipt-file=/var/run/waycloak-cni-install/install-receipt.json
            - --cni-binary-file=/var/run/waycloak-cni-install/waycloak-cni
            - --cni-config-file=/var/run/waycloak-cni-install/waycloak.conflist
          env:
            - name: WAYCLOAK_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: run
              mountPath: /run/waycloak
            - name: state
              mountPath: /var/lib/cni/waycloak
            - name: netns
              mountPath: /var/run/netns
              readOnly: true
              mountPropagation: HostToContainer
            - name: observation-identity
              mountPath: /var/run/secrets/waycloak-observation
              readOnly: true
            - name: api-identity
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: cni-receipt
              mountPath: /var/run/waycloak-cni-install/install-receipt.json
              readOnly: true
            - name: cni-binary
              mountPath: /var/run/waycloak-cni-install/waycloak-cni
              readOnly: true
            - name: cni-config
              mountPath: /var/run/waycloak-cni-install/waycloak.conflist
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              memory: 192Mi
      volumes:
        - name: run
          hostPath:
            path: /run/waycloak
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/lib/cni/waycloak
            type: DirectoryOrCreate
        - name: netns
          hostPath:
            path: /var/run/netns
            type: Directory
        - name: observation-identity
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 600
              - secret:
                  name: {{ $caSecret }}
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: api-identity
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: cni-receipt
          hostPath:
            path: {{ $cniReceipt }}
            type: File
        - name: cni-binary
          hostPath:
            path: {{ $cniBinary }}
            type: File
        - name: cni-config
          hostPath:
            path: {{ $cniConfig }}
            type: File
{{- end }}
