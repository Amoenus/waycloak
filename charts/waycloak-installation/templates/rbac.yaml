apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: waycloak-installation-controller
rules:
  - apiGroups: [installation.waycloak.io]
    resources: [waycloakinstallations]
    verbs: [get, list, watch]
  - apiGroups: [installation.waycloak.io]
    resources: [waycloakinstallations/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [networking.waycloak.io]
    resources: [vpngateways, vpnworkloadbindings, vpnegressroutes, portforwardleases, workloadadapters]
    verbs: [get, list, watch]
  - apiGroups: [networking.waycloak.io]
    resources: [vpngatewayclasses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete, bind, escalate]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings, mutatingadmissionpolicies, mutatingadmissionpolicybindings, mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: waycloak-installation-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: waycloak-installation-controller
subjects:
  - kind: ServiceAccount
    name: waycloak-installation-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: waycloak-installation-preflight
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: waycloak-installation-preflight
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: waycloak-installation-preflight
subjects:
  - kind: ServiceAccount
    name: waycloak-installation-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: waycloak-installation-runtime
  namespace: {{ .Values.runtimeNamespace }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, serviceaccounts, services, pods, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, bind, escalate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: waycloak-installation-runtime
  namespace: {{ .Values.runtimeNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: waycloak-installation-runtime
subjects:
  - kind: ServiceAccount
    name: waycloak-installation-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: waycloak-installation-journal
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: waycloak-installation-journal
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: waycloak-installation-journal
subjects:
  - kind: ServiceAccount
    name: waycloak-installation-controller
    namespace: {{ .Release.Namespace }}
